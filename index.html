<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australian Cellar Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            50: '#fdf2f4',
                            100: '#fce7ea',
                            200: '#f9d2d9',
                            300: '#f4adbb',
                            400: '#ec7c93',
                            500: '#e04768',
                            600: '#cc2b50',
                            700: '#ab1e3f',
                            800: '#8e1c37',
                            900: '#771c32',
                            950: '#430a17',
                        },
                        amber: {
                            500: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar for grid */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(142, 28, 55, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(142, 28, 55, 0.6);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <!-- Firebase Modular Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseSDK = {
            initializeApp,
            getAuth,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            getFirestore,
            collection,
            doc,
            onSnapshot,
            setDoc,
            deleteDoc
        };
    </script>

    <!-- React Application -->
    <script type="text/babel">
        
        // Helper: Halliday-style tasting note generator based on producer, wine name, region, varietal, vintage
        function generateHallidayBlurb(wine) {
            const region = wine.region || "South Australia";
            const varietal = wine.varietal || "Shiraz";
            const vintage = wine.vintage || "2018";
            const name = wine.name || "Estate Wine";
            const producer = wine.producer || "Winemaker";

            const descriptors = {
                "Shiraz": [
                    `A classic expression of ${region} Shiraz from the ${vintage} vintage. Deep, glossy purple in the glass with intense layers of dark plum, blackberry, and black pepper spices.`,
                    `Rich and sumptuously concentrated, showing ripe mulberry, star anise, and dark chocolate backed by fine-grained French oak tannins.`,
                    `Brilliant crimson-purple hue. Vibrant black cherry and mocha aromas lead into a palate of striking depth, framed by supple tannins and cool-climate mineral acidity.`
                ],
                "Cabernet Sauvignon": [
                    `Impeccably structured ${region} Cabernet with classic regional graphite, cassis, and cedar aromas.`,
                    `Shows classic ${region} bay leaf and dried herb notes wrapped around a tight core of blackcurrant and dark chocolate. Structured with firm, elegant tannins built for long-term cellaring.`,
                    `A classic medium-to-full-bodied vintage displaying pure dark berry fruits, olive tapenade, and polished oak nuances.`
                ],
                "Chardonnay": [
                    `Pure and luminous Chardonnay from ${region}. Bright white peach, citrus blossom, and subtle flinty reduction on the nose.`,
                    `Layered with lemon curd, roasted cashew, and vibrant natural acidity that gives great drive and persistence through the back-palate.`,
                    `Textural, refined, and beautifully balanced with restrained French oak supporting crisp grapefruit and wet stone character.`
                ],
                "Pinot Noir": [
                    `Fragrant and silky ${region} Pinot Noir brimming with wild raspberry, sour cherry, and forest floor spice notes.`,
                    `Focused and aromatic, featuring red currant and dried spice highlights backed by savory, fine-grained tannins and energetic natural acid.`,
                    `Displays ethereal poise with detailed dark cherry, violet, and delicate oak spice across a long, elegant finish.`
                ],
                "Grenache": [
                    `Distinguished old-vine ${region} Grenache bursting with aromatic wild strawberry, pomegranate, and cracked peppercorn.`,
                    `Luminous ruby hue with crunchy red berry fruits, blood orange zest, and silky sand-dune tannins. Drink now or over the next decade.`,
                    `Exquisite balance of spicy raspberry fruit and savoury whole-bunch complexity with a long, scented finish.`
                ],
                "Riesling": [
                    `Electric purity and precision from ${region}. Lifted lime blossom, lemongrass, and crushed slate aromas.`,
                    `Razor-sharp natural acidity drives intense lime zest and talc minerality. Outstanding cellaring potential.`,
                    `A pristine expression displaying classic citrus, white flower aromas, and a long, bone-dry mineral finish.`
                ]
            };

            // Select matching varietal pool or fallback
            let matchedKey = Object.keys(descriptors).find(k => varietal.toLowerCase().includes(k.toLowerCase()));
            let pool = matchedKey ? descriptors[matchedKey] : [
                `An outstanding ${vintage} ${varietal} from ${region}. Richly layered with pristine varietal fruits, fine oak integration, and great natural balance.`,
                `Impressive concentration and regional character. Beautifully balanced with fine structural tannins and a long, vibrant finish.`
            ];

            // Deterministic selection based on string hash so same wine gets same note
            const str = `${producer}-${name}-${vintage}-${varietal}-${region}`;
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const idx = Math.abs(hash) % pool.length;

            const drinkWindow = parseInt(vintage) ? `Drink ${parseInt(vintage) + 3}–${parseInt(vintage) + 20}.` : "Drink now through 2038.";
            const points = (92 + (Math.abs(hash) % 7)); // 92 to 98 points Halliday rating

            return `${pool[idx]} ${drinkWindow} 9${points % 10 > 7 ? '7' : points % 10 + 2} points - Halliday Wine Companion.`;
        }

        const { useState, useEffect, useMemo } = React;

        const DEFAULT_RACK_SIZE = 166;

        function App() {
            const [wines, setWines] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedSlot, setSelectedSlot] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [filterVarietal, setFilterVarietal] = useState("ALL");
            const [filterRegion, setFilterRegion] = useState("ALL");
            const [filterStatus, setFilterStatus] = useState("ALL");
            const [viewMode, setViewMode] = useState("grid"); // 'grid' | 'list'
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingWine, setEditingWine] = useState(null);
            const [syncStatus, setSyncStatus] = useState("offline"); // 'syncing' | 'synced' | 'offline'

            // Form state
            const [formData, setFormData] = useState({
                producer: "",
                name: "",
                vintage: new Date().getFullYear().toString(),
                varietal: "Shiraz",
                region: "Barossa Valley",
                slot: 1,
                quantity: 1,
                price: "",
                rating: "95",
                drinkBy: "2032",
                notes: ""
            });

            useEffect(() => {
                let unsubscribe = null;

                const initFirebase = async () => {
                    if (!window.FirebaseSDK || !window.FirebaseSDK.initializeApp) {
                        loadFromLocalStorage();
                        return;
                    }

                    try {
                        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, doc, onSnapshot } = window.FirebaseSDK;
                        
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'australian-cellar-tracker';
                        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

                        if (!firebaseConfig) {
                            loadFromLocalStorage();
                            return;
                        }

                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);

                        // Auth
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }

                        setSyncStatus("synced");

                        // Realtime Listener
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'wines');
                        unsubscribe = onSnapshot(colRef, (snapshot) => {
                            const wineList = [];
                            snapshot.forEach((docSnap) => {
                                wineList.push({ id: docSnap.id, ...docSnap.data() });
                            });

                            // Clean up any notes containing old CSV text
                            const cleanedList = wineList.map(w => {
                                if (!w.notes || w.notes.includes("Imported via 7-column CSV") || w.notes.includes("imported via") || w.notes.trim() === "") {
                                    w.notes = generateHallidayBlurb(w);
                                }
                                return w;
                            });

                            setWines(cleanedList);
                            setLoading(false);
                            setSyncStatus("synced");
                            // Cache to localStorage
                            localStorage.setItem("cellar_wines_backup", JSON.stringify(cleanedList));
                        }, (error) => {
                            console.error("Firebase sync error:", error);
                            setSyncStatus("offline");
                            loadFromLocalStorage();
                        });

                    } catch (e) {
                        console.error("Firebase init failed:", e);
                        setSyncStatus("offline");
                        loadFromLocalStorage();
                    }
                };

                initFirebase();

                return () => {
                    if (unsubscribe) unsubscribe();
                };
            }, []);

            const loadFromLocalStorage = () => {
                const local = localStorage.getItem("cellar_wines_backup");
                if (local) {
                    try {
                        const parsed = JSON.parse(local);
                        // Clean legacy note string
                        const cleaned = parsed.map(w => {
                            if (!w.notes || w.notes.includes("Imported via 7-column CSV") || w.notes.includes("imported via") || w.notes.trim() === "") {
                                w.notes = generateHallidayBlurb(w);
                            }
                            return w;
                        });
                        setWines(cleaned);
                    } catch (e) {
                        setWines(getSampleData());
                    }
                } else {
                    setWines(getSampleData());
                }
                setLoading(false);
            };

            const saveWineToDb = async (wine) => {
                setSyncStatus("syncing");
                // Update local storage immediately
                const existingIndex = wines.findIndex(w => w.id === wine.id);
                let updatedWines = [];
                if (existingIndex >= 0) {
                    updatedWines = [...wines];
                    updatedWines[existingIndex] = wine;
                } else {
                    updatedWines = [...wines, wine];
                }
                setWines(updatedWines);
                localStorage.setItem("cellar_wines_backup", JSON.stringify(updatedWines));

                // Try Firebase
                try {
                    if (window.FirebaseSDK && typeof __app_id !== 'undefined') {
                        const { getFirestore, doc, setDoc } = window.FirebaseSDK;
                        const db = getFirestore();
                        const appId = __app_id;
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wines', wine.id), wine);
                    }
                    setSyncStatus("synced");
                } catch (e) {
                    console.error("Firebase save failed, stored in localStorage", e);
                    setSyncStatus("offline");
                }
            };

            const deleteWineFromDb = async (id) => {
                setSyncStatus("syncing");
                const updatedWines = wines.filter(w => w.id !== id);
                setWines(updatedWines);
                localStorage.setItem("cellar_wines_backup", JSON.stringify(updatedWines));

                try {
                    if (window.FirebaseSDK && typeof __app_id !== 'undefined') {
                        const { getFirestore, doc, deleteDoc } = window.FirebaseSDK;
                        const db = getFirestore();
                        const appId = __app_id;
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wines', id));
                    }
                    setSyncStatus("synced");
                } catch (e) {
                    console.error("Firebase delete failed", e);
                    setSyncStatus("offline");
                }
            };

            const getSampleData = () => {
                const sample = [
                    { id: 'w1', producer: 'Penfolds', name: 'Grange', vintage: '2016', varietal: 'Shiraz', region: 'Barossa Valley', slot: 1, quantity: 2, price: '850', rating: '99', drinkBy: '2045', notes: '' },
                    { id: 'w2', producer: 'Henschke', name: 'Hill of Grace', vintage: '2017', varietal: 'Shiraz', region: 'Eden Valley', slot: 2, quantity: 1, price: '920', rating: '98', drinkBy: '2048', notes: '' },
                    { id: 'w3', producer: 'Cullen', name: 'Diana Madeline', vintage: '2019', varietal: 'Cabernet Sauvignon', region: 'Margaret River', slot: 15, quantity: 3, price: '145', rating: '97', drinkBy: '2038', notes: '' },
                    { id: 'w4', producer: 'Leeuwin Estate', name: 'Art Series', vintage: '2020', varietal: 'Chardonnay', region: 'Margaret River', slot: 24, quantity: 2, price: '130', rating: '98', drinkBy: '2032', notes: '' },
                    { id: 'w5', producer: 'Grosset', name: 'Polish Hill', vintage: '2022', varietal: 'Riesling', region: 'Clare Valley', slot: 40, quantity: 4, price: '65', rating: '96', drinkBy: '2037', notes: '' },
                    { id: 'w6', producer: 'Mount Mary', name: 'Quintet', vintage: '2018', varietal: 'Cabernet Sauvignon', region: 'Yarra Valley', slot: 52, quantity: 2, price: '160', rating: '97', drinkBy: '2040', notes: '' }
                ];

                return sample.map(w => ({
                    ...w,
                    notes: generateHallidayBlurb(w)
                }));
            };

            const filteredWines = useMemo(() => {
                return wines.filter(wine => {
                    const matchesSearch = 
                        wine.producer?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        wine.name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        wine.region?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        wine.varietal?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        wine.vintage?.toString().includes(searchQuery);

                    const matchesVarietal = filterVarietal === "ALL" || wine.varietal === filterVarietal;
                    const matchesRegion = filterRegion === "ALL" || wine.region === filterRegion;

                    let matchesStatus = true;
                    if (filterStatus === "DRINK_NOW") {
                        const currentYear = new Date().getFullYear();
                        matchesStatus = wine.drinkBy && parseInt(wine.drinkBy) <= currentYear + 2;
                    } else if (filterStatus === "CELLAR") {
                        const currentYear = new Date().getFullYear();
                        matchesStatus = wine.drinkBy && parseInt(wine.drinkBy) > currentYear + 2;
                    }

                    return matchesSearch && matchesVarietal && matchesRegion && matchesStatus;
                });
            }, [wines, searchQuery, filterVarietal, filterRegion, filterStatus]);

            // Slot map for fast 1-166 grid rendering
            const slotMap = useMemo(() => {
                const map = {};
                wines.forEach(w => {
                    const slotNum = parseInt(w.slot);
                    if (slotNum >= 1 && slotNum <= DEFAULT_RACK_SIZE) {
                        map[slotNum] = w;
                    }
                });
                return map;
            }, [wines]);

            // Stats
            const stats = useMemo(() => {
                const totalBottles = wines.reduce((sum, w) => sum + (parseInt(w.quantity) || 1), 0);
                const totalValue = wines.reduce((sum, w) => sum + ((parseFloat(w.price) || 0) * (parseInt(w.quantity) || 1)), 0);
                const avgRating = wines.length ? (wines.reduce((sum, w) => sum + (parseFloat(w.rating) || 0), 0) / wines.length).toFixed(1) : 0;
                const occupiedSlots = Object.keys(slotMap).length;

                return { totalBottles, totalValue, avgRating, occupiedSlots };
            }, [wines, slotMap]);

            // Unique lists for filters
            const varietals = useMemo(() => ["ALL", ...new Set(wines.map(w => w.varietal).filter(Boolean))], [wines]);
            const regions = useMemo(() => ["ALL", ...new Set(wines.map(w => w.region).filter(Boolean))], [wines]);

            const openAddModal = (slotNum = null) => {
                setEditingWine(null);
                setFormData({
                    producer: "",
                    name: "",
                    vintage: new Date().getFullYear().toString(),
                    varietal: "Shiraz",
                    region: "Barossa Valley",
                    slot: slotNum || findNextAvailableSlot(),
                    quantity: 1,
                    price: "",
                    rating: "95",
                    drinkBy: (new Date().getFullYear() + 10).toString(),
                    notes: ""
                });
                setIsModalOpen(true);
            };

            const openEditModal = (wine) => {
                setEditingWine(wine);
                setFormData({ ...wine });
                setIsModalOpen(true);
            };

            const findNextAvailableSlot = () => {
                for (let i = 1; i <= DEFAULT_RACK_SIZE; i++) {
                    if (!slotMap[i]) return i;
                }
                return 1;
            };

            const handleFormSubmit = (e) => {
                e.preventDefault();
                let blurb = formData.notes;

                // Ensure notes are Halliday style if blank or contains old import phrase
                if (!blurb || blurb.includes("Imported via 7-column CSV") || blurb.includes("imported via") || blurb.trim() === "") {
                    blurb = generateHallidayBlurb(formData);
                }

                const newWine = {
                    ...formData,
                    id: editingWine ? editingWine.id : 'wine_' + Date.now(),
                    notes: blurb,
                    slot: parseInt(formData.slot) || 1,
                    quantity: parseInt(formData.quantity) || 1
                };

                saveWineToDb(newWine);
                setIsModalOpen(false);
            };

            const handleDelete = (id) => {
                if (window.confirm("Are you sure you want to remove this bottle from your cellar?")) {
                    deleteWineFromDb(id);
                    setIsModalOpen(false);
                }
            };

            // CSV Import Cleanup & Halliday Generation
            const handleCSVImport = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const lines = text.split('\n');
                    const importedWines = [];

                    lines.forEach((line, index) => {
                        if (index === 0 && line.toLowerCase().includes("producer")) return; // skip header
                        if (!line.trim()) return;

                        const cols = line.split(',').map(c => c.trim().replace(/^"(.*)"$/, '$1'));
                        if (cols.length >= 2) {
                            const wineObj = {
                                id: 'csv_' + Date.now() + '_' + index,
                                producer: cols[0] || 'Unknown Producer',
                                name: cols[1] || 'Estate Red',
                                vintage: cols[2] || '2019',
                                varietal: cols[3] || 'Shiraz',
                                region: cols[4] || 'Barossa Valley',
                                slot: parseInt(cols[5]) || (index % DEFAULT_RACK_SIZE) + 1,
                                quantity: parseInt(cols[6]) || 1,
                                price: cols[7] || '50',
                                rating: cols[8] || '94',
                                drinkBy: cols[9] || '2030',
                                notes: cols[10] && !cols[10].includes("Imported via 7-column CSV") ? cols[10] : ''
                            };

                            // Always set a clean, professional Halliday Wine Companion blurb
                            wineObj.notes = generateHallidayBlurb(wineObj);
                            importedWines.push(wineObj);
                        }
                    });

                    if (importedWines.length > 0) {
                        importedWines.forEach(w => saveWineToDb(w));
                        alert(`Successfully imported ${importedWines.length} wines! Custom Halliday Guide blurbs generated.`);
                    }
                };
                reader.readAsText(file);
            };

            // CSV Export
            const handleCSVExport = () => {
                let csv = "Producer,Wine Name,Vintage,Varietal,Region,Rack Slot,Quantity,Price,Rating,Drink By,Notes (Halliday Blurb)\n";
                wines.forEach(w => {
                    csv += `"${w.producer}","${w.name}","${w.vintage}","${w.varietal}","${w.region}",${w.slot},${w.quantity},"${w.price}","${w.rating}","${w.drinkBy}","${(w.notes || '').replace(/"/g, '""')}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('href', url);
                a.setAttribute('download', `Cellar_Tracker_Export_${new Date().toISOString().slice(0, 10)}.csv`);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row md:items-center md:justify-between pb-6 border-b border-slate-800 gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-xl bg-burgundy-900 border border-burgundy-700 flex items-center justify-center text-burgundy-400 shadow-lg shadow-burgundy-950/50">
                                <i data-lucide="wine" className="w-7 h-7"></i>
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                                    Australian Cellar Tracker
                                    <span className="text-xs font-semibold uppercase px-2 py-0.5 rounded-full bg-burgundy-950 text-burgundy-300 border border-burgundy-800/60">
                                        Halliday Edition
                                    </span>
                                </h1>
                                <p className="text-xs text-slate-400">Real-time sync across PC & iOS • 166-Bottle Rack Grid</p>
                            </div>
                        </div>

                        {/* Controls Toolbar */}
                        <div className="flex flex-wrap items-center gap-2">
                            <button 
                                onClick={() => openAddModal()} 
                                className="px-4 py-2 bg-burgundy-700 hover:bg-burgundy-600 text-white font-medium text-sm rounded-lg flex items-center gap-2 transition shadow-md shadow-burgundy-900/30"
                            >
                                <i data-lucide="plus" className="w-4 h-4"></i> Add Bottle
                            </button>

                            <label className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg cursor-pointer flex items-center gap-2 border border-slate-700 transition">
                                <i data-lucide="upload" className="w-4 h-4 text-slate-400"></i> Import CSV
                                <input type="file" accept=".csv" onChange={handleCSVImport} className="hidden" />
                            </label>

                            <button 
                                onClick={handleCSVExport}
                                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg flex items-center gap-2 border border-slate-700 transition"
                            >
                                <i data-lucide="download" className="w-4 h-4 text-slate-400"></i> Export CSV
                            </button>

                            {/* View Switcher */}
                            <div className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                                <button 
                                    onClick={() => setViewMode("grid")}
                                    className={`p-1.5 rounded-md text-sm transition ${viewMode === "grid" ? "bg-burgundy-800 text-white" : "text-slate-400 hover:text-white"}`}
                                    title="166-Bottle Rack Grid View"
                                >
                                    <i data-lucide="grid" className="w-4 h-4"></i>
                                </button>
                                <button 
                                    onClick={() => setViewMode("list")}
                                    className={`p-1.5 rounded-md text-sm transition ${viewMode === "list" ? "bg-burgundy-800 text-white" : "text-slate-400 hover:text-white"}`}
                                    title="List View"
                                >
                                    <i data-lucide="list" className="w-4 h-4"></i>
                                </button>
                            </div>

                            {/* Sync Status Badge */}
                            <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 text-xs">
                                <span className={`w-2 h-2 rounded-full ${syncStatus === 'synced' ? 'bg-emerald-500 animate-pulse' : syncStatus === 'syncing' ? 'bg-amber-500 animate-ping' : 'bg-slate-500'}`}></span>
                                <span className="text-slate-300 font-medium">
                                    {syncStatus === 'synced' ? 'Cloud Synced' : syncStatus === 'syncing' ? 'Syncing...' : 'Offline Backup'}
                                </span>
                            </div>
                        </div>
                    </header>

                    {/* Summary Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 my-6">
                        <div className="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl shadow-sm">
                            <div className="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Inventory</div>
                            <div className="text-2xl font-bold text-white mt-1 flex items-baseline gap-2">
                                {stats.totalBottles} <span className="text-xs font-normal text-slate-400">bottles</span>
                            </div>
                        </div>
                        <div className="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl shadow-sm">
                            <div className="text-xs font-medium text-slate-400 uppercase tracking-wider">Rack Occupancy</div>
                            <div className="text-2xl font-bold text-burgundy-400 mt-1 flex items-baseline gap-2">
                                {stats.occupiedSlots} / {DEFAULT_RACK_SIZE} <span className="text-xs font-normal text-slate-400">slots</span>
                            </div>
                        </div>
                        <div className="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl shadow-sm">
                            <div className="text-xs font-medium text-slate-400 uppercase tracking-wider">Estimated Value</div>
                            <div className="text-2xl font-bold text-emerald-400 mt-1">
                                ${stats.totalValue.toLocaleString()} <span className="text-xs font-normal text-slate-400">AUD</span>
                            </div>
                        </div>
                        <div className="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl shadow-sm">
                            <div className="text-xs font-medium text-slate-400 uppercase tracking-wider">Avg Halliday Score</div>
                            <div className="text-2xl font-bold text-amber-400 mt-1 flex items-center gap-1">
                                <i data-lucide="star" className="w-5 h-5 fill-amber-400 text-amber-400"></i>
                                {stats.avgRating} <span className="text-xs font-normal text-slate-400">/ 100</span>
                            </div>
                        </div>
                    </div>

                    {/* Filters & Search */}
                    <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700/80 mb-6 flex flex-wrap gap-3 items-center justify-between">
                        <div className="relative flex-1 min-w-[220px]">
                            <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                            <input 
                                type="text"
                                placeholder="Search producer, wine, varietal, region..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full pl-9 pr-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                            />
                        </div>

                        <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                            <select 
                                value={filterVarietal}
                                onChange={(e) => setFilterVarietal(e.target.value)}
                                className="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                            >
                                <option value="ALL">All Varietals</option>
                                {varietals.filter(v => v !== "ALL").map(v => <option key={v} value={v}>{v}</option>)}
                            </select>

                            <select 
                                value={filterRegion}
                                onChange={(e) => setFilterRegion(e.target.value)}
                                className="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                            >
                                <option value="ALL">All Regions</option>
                                {regions.filter(r => r !== "ALL").map(r => <option key={r} value={r}>{r}</option>)}
                            </select>

                            <select 
                                value={filterStatus}
                                onChange={(e) => setFilterStatus(e.target.value)}
                                className="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                            >
                                <option value="ALL">All Drinking Windows</option>
                                <option value="DRINK_NOW">Ready to Drink</option>
                                <option value="CELLAR">Keep Cellaring</option>
                            </select>
                        </div>
                    </div>

                    {/* MAIN VIEW CONTENT */}
                    {loading ? (
                        <div className="py-20 text-center text-slate-400">
                            <div className="w-8 h-8 border-4 border-burgundy-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                            Loading cellar rack state...
                        </div>
                    ) : viewMode === "grid" ? (
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <h2 className="text-lg font-semibold text-slate-200 flex items-center gap-2">
                                        <i data-lucide="layout-grid" className="w-5 h-5 text-burgundy-500"></i>
                                        166-Slot Main Cellar Rack
                                    </h2>
                                    <p className="text-xs text-slate-400">Click any occupied slot to view Halliday blurbs or an empty slot to place a bottle.</p>
                                </div>
                                <div className="flex items-center gap-4 text-xs text-slate-400">
                                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 bg-burgundy-900 border border-burgundy-500 rounded"></span> Occupied</span>
                                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 bg-slate-800/80 border border-slate-700 rounded"></span> Empty</span>
                                </div>
                            </div>

                            {/* 166 Rack Grid Layout */}
                            <div className="grid grid-cols-6 sm:grid-cols-10 md:grid-cols-12 lg:grid-cols-14 xl:grid-cols-16 gap-2 max-h-[600px] overflow-y-auto p-2 custom-scrollbar bg-slate-950/60 rounded-xl border border-slate-800">
                                {Array.from({ length: DEFAULT_RACK_SIZE }, (_, i) => i + 1).map(slotNum => {
                                    const wine = slotMap[slotNum];
                                    const isSelected = selectedSlot === slotNum;

                                    return (
                                        <div 
                                            key={slotNum}
                                            onClick={() => {
                                                setSelectedSlot(slotNum);
                                                if (!wine) {
                                                    openAddModal(slotNum);
                                                }
                                            }}
                                            className={`aspect-square rounded-lg p-1 flex flex-col justify-between items-center text-center cursor-pointer transition relative group border ${
                                                wine 
                                                    ? 'bg-burgundy-950/80 border-burgundy-700/80 text-burgundy-100 hover:border-burgundy-400 shadow-sm' 
                                                    : 'bg-slate-900/60 border-slate-800 text-slate-600 hover:border-slate-600 hover:text-slate-400'
                                            }`}
                                        >
                                            <span className="text-[10px] font-mono text-slate-400 opacity-70">#{slotNum}</span>
                                            
                                            {wine ? (
                                                <>
                                                    <i data-lucide="wine" className="w-4 h-4 text-burgundy-400 group-hover:scale-110 transition-transform"></i>
                                                    <div className="text-[9px] font-semibold truncate w-full px-0.5 text-slate-200">
                                                        {wine.vintage}
                                                    </div>
                                                </>
                                            ) : (
                                                <i data-lucide="plus-circle" className="w-3.5 h-3.5 opacity-0 group-hover:opacity-100 text-slate-500 transition-opacity"></i>
                                            )}

                                            {/* Hover Tooltip Card */}
                                            {wine && (
                                                <div className="absolute z-20 bottom-full left-1/2 -translate-x-1/2 mb-2 w-64 p-3 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity text-left">
                                                    <div className="text-xs font-bold text-white truncate">{wine.producer}</div>
                                                    <div className="text-xs text-burgundy-300 truncate">{wine.name} ({wine.vintage})</div>
                                                    <div className="text-[11px] text-slate-400 mt-1">{wine.varietal} • {wine.region}</div>
                                                    <div className="mt-2 text-[11px] text-slate-300 bg-slate-900/90 p-2 rounded border border-slate-700/50 italic line-clamp-3">
                                                        "{wine.notes}"
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Quick Slot Preview Footer */}
                            {selectedSlot && slotMap[selectedSlot] && (
                                <div className="mt-4 p-4 bg-slate-800/90 border border-burgundy-900/60 rounded-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                    <div className="space-y-1">
                                        <div className="flex items-center gap-2">
                                            <span className="px-2 py-0.5 bg-burgundy-900 text-burgundy-200 text-xs font-mono font-bold rounded">Slot #{selectedSlot}</span>
                                            <h3 className="font-bold text-white text-base">
                                                {slotMap[selectedSlot].producer} - {slotMap[selectedSlot].name} ({slotMap[selectedSlot].vintage})
                                            </h3>
                                        </div>
                                        <p className="text-xs text-slate-400">
                                            {slotMap[selectedSlot].varietal} | {slotMap[selectedSlot].region} | Qty: {slotMap[selectedSlot].quantity} | Halliday Rating: <span className="text-amber-400 font-semibold">{slotMap[selectedSlot].rating}/100</span>
                                        </p>
                                        <p className="text-xs text-slate-300 italic bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60 mt-2 max-w-3xl">
                                            "{slotMap[selectedSlot].notes}"
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => openEditModal(slotMap[selectedSlot])}
                                        className="px-4 py-2 bg-burgundy-800 hover:bg-burgundy-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 shrink-0"
                                    >
                                        <i data-lucide="edit-3" className="w-3.5 h-3.5"></i> Edit Details
                                    </button>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {filteredWines.length === 0 ? (
                                <div className="bg-slate-800/40 border border-slate-800 rounded-xl p-12 text-center text-slate-400">
                                    No wines matched your filter or search query.
                                </div>
                            ) : (
                                filteredWines.map(wine => (
                                    <div 
                                        key={wine.id} 
                                        className="bg-slate-800/80 border border-slate-700/80 rounded-xl p-5 hover:border-burgundy-800/80 transition-all shadow-md flex flex-col lg:flex-row justify-between gap-4"
                                    >
                                        <div className="space-y-2 flex-1">
                                            <div className="flex flex-wrap items-center gap-2">
                                                <span className="px-2.5 py-1 bg-burgundy-950 text-burgundy-300 border border-burgundy-800/80 text-xs font-bold font-mono rounded-md">
                                                    Slot #{wine.slot}
                                                </span>
                                                <h3 className="text-lg font-bold text-white">
                                                    {wine.producer} <span className="font-normal text-slate-300">{wine.name}</span> ({wine.vintage})
                                                </h3>
                                                <span className="text-xs px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 font-medium">
                                                    {wine.varietal}
                                                </span>
                                            </div>

                                            <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-400">
                                                <span><strong className="text-slate-300">Region:</strong> {wine.region}</span>
                                                <span><strong className="text-slate-300">Quantity:</strong> {wine.quantity} bottle(s)</span>
                                                <span><strong className="text-slate-300">Est. Price:</strong> ${wine.price || 'N/A'} AUD</span>
                                                <span><strong className="text-slate-300">Drink Window:</strong> Through {wine.drinkBy || '2035'}</span>
                                            </div>

                                            {/* Halliday Tasting Note */}
                                            <div className="mt-3 bg-slate-900/90 border border-slate-700/50 p-3 rounded-lg">
                                                <div className="text-[11px] font-semibold text-amber-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                                    <i data-lucide="award" className="w-3.5 h-3.5"></i>
                                                    Halliday Wine Companion Tasting Note ({wine.rating || '95'} pts)
                                                </div>
                                                <p className="text-xs text-slate-300 italic leading-relaxed">
                                                    "{wine.notes}"
                                                </p>
                                            </div>
                                        </div>

                                        <div className="flex lg:flex-col items-center lg:items-end justify-between lg:justify-center border-t lg:border-t-0 pt-3 lg:pt-0 border-slate-700/60 gap-3">
                                            <div className="text-right">
                                                <div className="text-xs text-slate-400">Halliday Rating</div>
                                                <div className="text-xl font-bold text-amber-400 flex items-center justify-end gap-1">
                                                    <i data-lucide="star" className="w-4 h-4 fill-amber-400"></i>
                                                    {wine.rating || 95}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button 
                                                    onClick={() => openEditModal(wine)}
                                                    className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-medium rounded-lg transition"
                                                >
                                                    Edit
                                                </button>
                                                <button 
                                                    onClick={() => handleDelete(wine.id)}
                                                    className="px-3 py-1.5 bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/50 text-xs font-medium rounded-lg transition"
                                                >
                                                    Remove
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    )}

                    {}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
                                <div className="flex justify-between items-center pb-4 border-b border-slate-800">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                        <i data-lucide="wine" className="w-5 h-5 text-burgundy-500"></i>
                                        {editingWine ? 'Edit Wine Entry' : 'Add New Bottle to Cellar'}
                                    </h2>
                                    <button 
                                        onClick={() => setIsModalOpen(false)}
                                        className="text-slate-400 hover:text-white p-1"
                                    >
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleFormSubmit} className="mt-4 space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Producer / Winery *</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={formData.producer} 
                                                onChange={e => setFormData({...formData, producer: e.target.value})}
                                                placeholder="e.g. Penfolds"
                                                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Wine Name / Label *</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={formData.name} 
                                                onChange={e => setFormData({...formData, name: e.target.value})}
                                                placeholder="e.g. St Henri"
                                                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Vintage *</label>
                                            <input 
                                                type="number" 
                                                required
                                                value={formData.vintage} 
                                                onChange={e => setFormData({...formData, vintage: e.target.value})}
                                                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Varietal</label>
                                            <input 
                                                type="text" 
                                                value={formData.varietal} 
                                                onChange={e => setFormData({...formData, varietal: e.target.value})}
                                                placeholder="Shiraz"
                                                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Region</label>
                                            <input 
                                                type="text" 
                                                value={formData.region} 
                                                onChange={e => setFormData({...formData, region: e.target.value})}
                                                placeholder="Barossa Valley"
                                                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-4 gap-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Rack Slot (1-166)</label>
                                            <input 
                                                type="number" 
                                                min="1" 
                                                max="166"
                                                value={formData.slot} 
                                                onChange={e => setFormData({...formData, slot: e.target.value})}
                                                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Quantity</label>
                                            <input 
                                                type="number" 
                                                min="1"
                                                value={formData.quantity} 
                                                onChange={e => setFormData({...formData, quantity: e.target.value})}
                                                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Price (AUD)</label>
                                            <input 
                                                type="number" 
                                                value={formData.price} 
                                                onChange={e => setFormData({...formData, price: e.target.value})}
                                                placeholder="120"
                                                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Rating (/100)</label>
                                            <input 
                                                type="number" 
                                                min="80" 
                                                max="100"
                                                value={formData.rating} 
                                                onChange={e => setFormData({...formData, rating: e.target.value})}
                                                className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="block text-xs font-medium text-slate-300">Halliday Tasting Note Blurb</label>
                                            <button 
                                                type="button" 
                                                onClick={() => setFormData({...formData, notes: generateHallidayBlurb(formData)})}
                                                className="text-[11px] text-burgundy-400 hover:underline font-medium"
                                            >
                                                Auto-Generate Halliday Note
                                            </button>
                                        </div>
                                        <textarea 
                                            rows="3"
                                            value={formData.notes} 
                                            onChange={e => setFormData({...formData, notes: e.target.value})}
                                            placeholder="Leave blank to auto-generate a professional Halliday Companion tasting blurb..."
                                            className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-burgundy-600 italic"
                                        ></textarea>
                                    </div>

                                    <div className="flex justify-between items-center pt-4 border-t border-slate-800">
                                        {editingWine ? (
                                            <button 
                                                type="button" 
                                                onClick={() => handleDelete(editingWine.id)}
                                                className="px-4 py-2 bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-800 text-xs font-semibold rounded-lg transition"
                                            >
                                                Delete Entry
                                            </button>
                                        ) : <div></div>}

                                        <div className="flex gap-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setIsModalOpen(false)}
                                                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition"
                                            >
                                                Cancel
                                            </button>
                                            <button 
                                                type="submit" 
                                                className="px-5 py-2 bg-burgundy-700 hover:bg-burgundy-600 text-white text-xs font-bold rounded-lg shadow-md transition"
                                            >
                                                {editingWine ? 'Update Wine' : 'Add Wine'}
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

        // Refresh icons whenever DOM updates
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 300);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiran's Cellar Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM (versions pinned so a future CDN update can't break the app) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen font-sans">
  <div id="root"></div>

  <!-- If the CDN libraries fail to load, say so instead of showing a blank page. -->
  <script>
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && !root.hasChildNodes()) {
        root.innerHTML = '<div style="max-width:560px;margin:40px auto;padding:20px;font-family:sans-serif;color:#e7e5e4">' +
          '<h1 style="color:#f59e0b;font-size:20px;font-weight:bold">Cellar Tracker could not load</h1>' +
          '<p style="font-size:14px;margin-top:8px">The app libraries did not download (check your internet connection) and then reload. ' +
          'Your cellar data is still saved in this browser and has not been touched.</p></div>';
      }
    }, 10000);
  </script>

  <!-- data-presets="react": only JSX is compiled; everything else runs as modern JavaScript (all current browsers). -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;

    // ---------------------------------------------------------------------
    // CONSTANTS
    // ---------------------------------------------------------------------
    const CURRENT_YEAR = new Date().getFullYear();
    const FRIDGE_CAPACITY = 166;

    // DO NOT CHANGE STORAGE_KEY — your existing cellar lives under this key.
    const STORAGE_KEY = 'kirans_cellar_wines_v2';
    const SNAPSHOT_KEY = 'kirans_cellar_snapshots';
    const META_KEY = 'kirans_cellar_meta';
    const HISTORY_KEY = 'kirans_cellar_history';
    const TOMBSTONE_KEY = 'kirans_cellar_tombstones';   // ids of deleted wines / log entries (so deletes sync)
    const SYNC_KEY = 'kirans_cellar_sync';               // GitHub sync settings for THIS device (incl. token)
    const SYNC_DEBOUNCE_MS = 3000;
    const SYNC_POLL_MS = 30000;
    const PRE_MIGRATION_KEY = 'kirans_cellar_wines_v2_pre_v3_backup';
    const CORRUPT_KEY_PREFIX = 'kirans_cellar_unreadable_';
    const SCHEMA_VERSION = 3;
    const MAX_SNAPSHOTS = 12;
    const BACKUP_REMINDER_DAYS = 14;

    const TIERS = ['Green', 'Yellow', 'Blue', 'Red'];
    const TIER_COLORS = {
      Green: "bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.8)]",
      Yellow: "bg-amber-400 shadow-[0_0_6px_rgba(251,191,36,0.8)]",
      Blue: "bg-sky-400 shadow-[0_0_6px_rgba(56,189,248,0.8)]",
      Red: "bg-rose-500 shadow-[0_0_6px_rgba(244,63,94,0.8)]"
    };
    const TIER_LABELS = {
      Green: 'Green (Everyday)',
      Yellow: 'Yellow (Premium Everyday)',
      Blue: 'Blue (Cellar Classic)',
      Red: 'Red (Iconic / Special)'
    };

    // Reference list used for auto-fill. Scores and drink spans are indicative
    // (not vintage-specific) and are shown as estimates until you edit them.
    // styleNote is a short reference description, NOT a quoted Halliday review.
    const BENCHMARK_DATABASE = [
      { producer: "Penfolds", name: "Grange Shiraz", region: "Multi-Regional SA", varietal: "Shiraz", tier: "Red", hallidayScore: 99, vivinoRating: 4.8, drinkSpan: [8, 35],
        styleNote: "Saturated deep purple. An immense, regal palate offering dark chocolate, dense blackberry, licorice, and seamless oak structure. Magnificent depth." },
      { producer: "Penfolds", name: "St Henri Shiraz", region: "Barossa Valley", varietal: "Shiraz", tier: "Red", hallidayScore: 96, vivinoRating: 4.4, drinkSpan: [6, 25],
        styleNote: "Matured in large, old oak vats rather than new barrels. Supple dark plum, fine savoury tannin, charcoal notes, and exceptional longevity." },
      { producer: "Leeuwin Estate", name: "Art Series Chardonnay", region: "Margaret River", varietal: "Chardonnay", tier: "Red", hallidayScore: 98, vivinoRating: 4.6, drinkSpan: [3, 14],
        styleNote: "Benchmark Australian Chardonnay. Explosive white peach, flint, grapefruit zest, and immaculately integrated French oak." },
      { producer: "Grosset", name: "Polish Hill Riesling", region: "Clare Valley", varietal: "Riesling", tier: "Blue", hallidayScore: 96, vivinoRating: 4.3, drinkSpan: [2, 20],
        styleNote: "Laser-like focus and slatey mineral drive. Expresses pure lime juice, orange blossom, and piercing, precise acidity." },
      { producer: "Tyrrell's", name: "Vat 1 Semillon", region: "Hunter Valley", varietal: "Semillon", tier: "Yellow", hallidayScore: 98, vivinoRating: 4.3, drinkSpan: [1, 15],
        styleNote: "Light straw-green. Intense lemongrass and lime curd with vibrant texture, building towards a complex, buttery beeswax evolution." },
      { producer: "Clonakilla", name: "Shiraz Viognier", region: "Murrumbateman", varietal: "Shiraz", tier: "Red", hallidayScore: 97, vivinoRating: 4.5, drinkSpan: [4, 18],
        styleNote: "Fragrant, floral, and silky. Red cherry, spice, white pepper, and seamless silky tannins crafted with incredible elegance." },
      { producer: "Golden Grove", name: "Estate Chardonnay", region: "Granite Belt", varietal: "Chardonnay", tier: "Green", hallidayScore: 91, vivinoRating: 3.9, drinkSpan: [1, 4],
        styleNote: "Crisp granitic acidity, bright lemon curd, subtle cashew notes, and a clean, refreshing finish." }
    ];

    // Text the old version auto-generated. Used only to clean it out of notes during migration.
    const LEGACY_GENERATED_NOTES = new Set([
      ...BENCHMARK_DATABASE.map(b => b.styleNote),
      "Classic un-oaked sophistication. Supple dark plum, fine savory tannin, charcoal notes, and exceptional longevity.",
      "Saved Wishlist Item"
    ]);
    const LEGACY_TEMPLATE_RE = /^Rated \d+(\.\d+)? pts\b/;

    // Typical drinking windows (years after vintage) when nothing better is known.
    const DEFAULT_WINDOWS = [
      [/sparkling|champagne|prosecco|p[eé]t-?nat/i, [1, 6]],
      [/sauvignon|ros[eé]|pinot gri|grigio|moscato|vermentino|fiano/i, [0, 3]],
      [/riesling|semillon/i, [1, 12]],
      [/chardonnay/i, [1, 7]],
      [/pinot/i, [2, 10]],
      [/cabernet|nebbiolo|mourv|mataro|petit verdot/i, [4, 20]],
      [/shiraz|syrah|grenache|tempranillo|sangiovese|merlot|malbec|blend/i, [2, 12]]
    ];

    // ---------------------------------------------------------------------
    // SAFE STORAGE HELPERS
    // ---------------------------------------------------------------------
    const storage = {
      get(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
      set(key, value) {
        try { window.localStorage.setItem(key, value); return true; }
        catch (e) { console.error('Storage write failed', e); return false; }
      },
      remove(key) { try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ } }
    };
    const readJson = (key, fallback) => {
      const raw = storage.get(key);
      if (raw == null) return fallback;
      try { return JSON.parse(raw); } catch (e) { return fallback; }
    };

    const localDate = (d = new Date()) => d.toLocaleDateString('en-CA'); // YYYY-MM-DD
    const fmtDateTime = (iso) => {
      try { return new Date(iso).toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
      catch (e) { return iso; }
    };
    const daysSince = (iso) => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : Infinity;
    const fmtMoney = (n) => '$' + Math.round(Number(n) || 0).toLocaleString('en-AU');

    const newId = () => (window.crypto && typeof crypto.randomUUID === 'function')
      ? crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;

    const toBool = (v) => v === true || v === 1 || (typeof v === 'string' && /^(true|yes|y|1)$/i.test(v.trim()));
    const num = (v) => {
      if (v === undefined || v === null) return undefined;
      const s = String(v).replace(/[$,\s]/g, '');
      if (s === '') return undefined;
      const n = Number(s);
      return Number.isFinite(n) ? n : undefined;
    };
    const normTier = (v) => TIERS.find(t => t.toLowerCase() === String(v || '').trim().toLowerCase()) || 'Green';

    const downloadFile = (filename, content, type) => {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    };

    // ---------------------------------------------------------------------
    // WINE DATA HELPERS
    // ---------------------------------------------------------------------
    const findBenchmark = (producer, name) => BENCHMARK_DATABASE.find(b =>
      b.producer.toLowerCase() === String(producer || '').trim().toLowerCase() &&
      b.name.toLowerCase() === String(name || '').trim().toLowerCase()
    );

    const defaultWindow = (varietal, vintage) => {
      const v = Number(vintage) || CURRENT_YEAR;
      const hit = DEFAULT_WINDOWS.find(([re]) => re.test(varietal || ''));
      const [a, b] = hit ? hit[1] : [2, 8];
      return [v + a, v + b];
    };

    const estimateWindow = (producer, name, varietal, vintage) => {
      const match = findBenchmark(producer, name);
      if (match) {
        const v = Number(vintage) || CURRENT_YEAR;
        return [v + match.drinkSpan[0], v + match.drinkSpan[1]];
      }
      return defaultWindow(varietal, vintage);
    };

    // Deterministic estimate: cost × tier multiplier (+5% for Halliday 96+).
    const calculateMarketPrice = (costPrice, tier, halliday) => {
      const baseCost = Number(costPrice) || 0;
      let multiplier = 1.15;
      if (tier === 'Red') multiplier = 1.25;
      else if (tier === 'Blue') multiplier = 1.20;
      else if (tier === 'Yellow') multiplier = 1.15;
      else if (tier === 'Green') multiplier = 1.10;
      const hallidayBonus = (halliday != null && Number(halliday) >= 96) ? 0.05 : 0;
      return Math.round(baseCost * (multiplier + hallidayBonus));
    };

    // Build a clean, fixed-shape wine record. Idempotent: sanitize(sanitize(w)) === sanitize(w).
    const sanitize = (w) => {
      const str = (v) => (v === undefined || v === null) ? '' : String(v);
      const numOr = (v, d) => { const n = num(v); return n === undefined ? d : n; };
      const tier = normTier(w.tier);
      const hallidayScore = numOr(w.hallidayScore, null);
      const vivinoRating = numOr(w.vivinoRating, null);
      const costPriceAud = Math.max(0, numOr(w.costPriceAud, 0));
      const priceManual = toBool(w.priceManual);
      const out = {
        id: str(w.id) || newId(),
        producer: str(w.producer).trim(),
        name: str(w.name).trim(),
        vintage: str(w.vintage).trim(),
        region: str(w.region).trim(),
        varietal: str(w.varietal).trim(),
        quantity: Math.max(0, Math.round(numOr(w.quantity, 0))),
        tier,
        costPriceAud,
        priceAud: 0,
        priceManual,
        hallidayScore,
        vivinoRating,
        ratingsVerified: toBool(w.ratingsVerified),
        drinkStart: numOr(w.drinkStart, null),
        drinkEnd: numOr(w.drinkEnd, null),
        windowEstimated: toBool(w.windowEstimated),
        isWishlist: toBool(w.isWishlist),
        notes: str(w.notes),
        styleNote: str(w.styleNote),
        updatedAt: str(w.updatedAt),
        _v: SCHEMA_VERSION
      };
      out.priceAud = priceManual ? Math.max(0, numOr(w.priceAud, 0)) : calculateMarketPrice(costPriceAud, tier, hallidayScore);
      return out;
    };

    // Upgrade a record from the old (v2) format. Never discards your own tasting notes.
    const migrateLegacyWine = (raw) => {
      const w = { ...raw };
      const match = findBenchmark(w.producer, w.name);

      // Notes: strip auto-generated text, keep everything you wrote.
      const parts = (typeof w.notes === 'string' ? w.notes : '').split(' | ');
      const first = (parts[0] || '').trim();
      if (LEGACY_TEMPLATE_RE.test(first) || LEGACY_GENERATED_NOTES.has(first) || /imported via/i.test(first)) parts.shift();
      w.notes = parts.join(' | ').trim();
      w.styleNote = match ? match.styleNote : '';

      // Ratings: identify placeholders the old version invented.
      const h = num(w.hallidayScore), v = num(w.vivinoRating);
      if (match) {
        w.ratingsVerified = !(h === match.hallidayScore && v === match.vivinoRating);
      } else if ((h === 92 && v === 4.1) || (w.isWishlist && h === 90 && v === 4.0) || (h === undefined && v === undefined)) {
        w.hallidayScore = null; w.vivinoRating = null; w.ratingsVerified = false;
      } else {
        w.ratingsVerified = true;
      }

      // Market price: keep anything that looks hand-entered.
      const cost = num(w.costPriceAud) || 0;
      const price = num(w.priceAud);
      const autoOld = calculateMarketPrice(cost, normTier(w.tier), h);
      const legacyAutoOld = Math.round((cost || 30) * ({ Red: 1.25, Blue: 1.2, Yellow: 1.15, Green: 1.1 }[normTier(w.tier)] + ((h || 0) >= 96 ? 0.05 : 0)));
      const looksAuto = price === undefined || price === 0 || price === autoOld || price === legacyAutoOld || (price === 35 && cost === 30);
      w.priceManual = !looksAuto;

      // Drink window: flag the old generic guess (vintage+2 → vintage+8) and benchmark spans as estimates.
      const vy = Number(w.vintage) || CURRENT_YEAR;
      const ds = num(w.drinkStart), de = num(w.drinkEnd);
      w.windowEstimated = !!match || (ds === vy + 2 && de === vy + 8) || ds === undefined || de === undefined;
      if (ds === undefined || de === undefined) {
        const [a, b] = estimateWindow(w.producer, w.name, w.varietal, w.vintage);
        w.drinkStart = a; w.drinkEnd = b;
      }
      return sanitize(w);
    };

    const normalizeWine = (raw) => (raw && raw._v === SCHEMA_VERSION) ? sanitize(raw) : migrateLegacyWine(raw || {});

    const normalizeList = (list) => {
      const seen = new Set();
      return (Array.isArray(list) ? list : [])
        .filter(w => w && typeof w === 'object' && (w.producer || w.name))
        .map(normalizeWine)
        .map(w => {
          if (seen.has(w.id)) w = { ...w, id: newId() };
          seen.add(w.id);
          return w;
        });
    };

    const mergeWines = (current, incoming) => {
      const incById = new Map(incoming.map(w => [w.id, w]));
      const currentIds = new Set(current.map(w => w.id));
      const updated = current.map(w => incById.has(w.id) ? incById.get(w.id) : w);
      const added = incoming.filter(w => !currentIds.has(w.id));
      return [...added, ...updated];
    };

    const sumBottles = (list) => list.reduce((a, w) => a + (w.quantity || 0), 0);

    // ---------------------------------------------------------------------
    // WINE MOVEMENT HISTORY (bottles in / out of the cellar)
    // ---------------------------------------------------------------------
    const OUT_REASONS = ['Drunk', 'Gifted', 'Sold', 'Spoiled / corked', 'Correction', 'Deleted'];
    const IN_REASONS = ['Purchased', 'Gift received', 'Added', 'Correction', 'Moved from wishlist', 'CSV import'];
    const MERGEABLE_REASONS = new Set(['Drunk', 'Purchased']);
    const cellarQty = (w) => (w && !w.isWishlist) ? (w.quantity || 0) : 0;

    const makeEvent = (wine, change, balance, reason, at = new Date().toISOString()) => ({
      id: newId(),
      at,
      wineId: wine.id,
      producer: wine.producer,
      name: wine.name,
      vintage: wine.vintage,
      varietal: wine.varietal,
      region: wine.region,
      tier: wine.tier,
      change,
      balance,
      reason,
      unitCost: wine.costPriceAud || 0,
      unitValue: wine.priceAud || 0,
      note: ''
    });

    // Compare two cellar states and describe every bottle movement between them.
    // reason: a string, or { in: '...', out: '...' }.
    const diffMovements = (prev, next, reason) => {
      const prevById = new Map(prev.map(w => [w.id, w]));
      const nextById = new Map(next.map(w => [w.id, w]));
      const ids = new Set([...prevById.keys(), ...nextById.keys()]);
      const at = new Date().toISOString();
      const events = [];
      ids.forEach(id => {
        const before = cellarQty(prevById.get(id));
        const after = cellarQty(nextById.get(id));
        if (before === after) return;
        const change = after - before;
        const r = typeof reason === 'string' ? reason : (change > 0 ? reason.in : reason.out);
        events.push(makeEvent(nextById.get(id) || prevById.get(id), change, after, r, at));
      });
      return events;
    };

    // Append events; rapid +/- taps on the same wine within 2 minutes become one line.
    const appendEvents = (history, events) => {
      const out = [...history];
      events.forEach(ev => {
        const last = out[out.length - 1];
        if (last && last.wineId === ev.wineId && last.reason === ev.reason && MERGEABLE_REASONS.has(ev.reason) &&
            Math.sign(last.change) === Math.sign(ev.change) && !last.note &&
            (new Date(ev.at) - new Date(last.at)) < 120000) {
          out[out.length - 1] = { ...last, change: last.change + ev.change, balance: ev.balance, at: ev.at };
        } else {
          out.push(ev);
        }
      });
      return out;
    };

    const openingBalance = (wines) => {
      const at = new Date().toISOString();
      return wines.filter(w => cellarQty(w) > 0).map(w => makeEvent(w, cellarQty(w), cellarQty(w), 'Opening balance', at));
    };

    const sanitizeHistory = (list) => (Array.isArray(list) ? list : [])
      .filter(e => e && typeof e === 'object' && e.at && Number.isFinite(Number(e.change)))
      .map(e => ({ ...e, id: String(e.id || newId()), change: Number(e.change), balance: Number(e.balance) || 0, note: e.note ? String(e.note) : '' }));

    const unionHistory = (a, b) => {
      const seen = new Set();
      return [...a, ...b].filter(e => (seen.has(e.id) ? false : (seen.add(e.id), true)))
        .sort((x, y) => new Date(x.at) - new Date(y.at));
    };

    const HISTORY_COLUMNS = [
      ['Date', e => localDate(new Date(e.at))],
      ['Time', e => new Date(e.at).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false })],
      ['Direction', e => e.change > 0 ? 'IN' : 'OUT'],
      ['Reason', e => e.reason],
      ['Qty Change', e => e.change],
      ['Balance After', e => e.balance],
      ['Producer', e => e.producer],
      ['Wine', e => e.name],
      ['Vintage', e => e.vintage],
      ['Varietal', e => e.varietal],
      ['Region', e => e.region],
      ['Tier', e => e.tier],
      ['Unit Cost (AUD)', e => e.unitCost],
      ['Line Cost (AUD)', e => Math.round(e.change * (e.unitCost || 0) * 100) / 100],
      ['Unit Value (AUD)', e => e.unitValue],
      ['Line Value (AUD)', e => Math.round(e.change * (e.unitValue || 0) * 100) / 100],
      ['Note', e => e.note],
      ['Wine ID', e => e.wineId],
      ['Entry ID', e => e.id]
    ];
    // ---------------------------------------------------------------------
    // GITHUB CLOUD SYNC (private repository, GitHub REST "contents" API)
    // ---------------------------------------------------------------------
    const parseRepo = (input) => {
      const s = String(input || '').trim().replace(/\.git$/i, '').replace(/\/+$/, '');
      const m = s.match(/github\.com[/:]([^/\s]+)\/([^/\s?#]+)/i) || s.match(/^([A-Za-z0-9-_.]+)\/([A-Za-z0-9-_.]+)$/);
      return m ? { owner: m[1], repo: m[2] } : null;
    };

    const guessDeviceName = () => {
      const ua = navigator.userAgent || '';
      if (/iPhone/.test(ua)) return 'iPhone';
      if (/iPad/.test(ua)) return 'iPad';
      if (/Android/.test(ua)) return 'Android phone';
      if (/Macintosh/.test(ua)) return 'Mac';
      if (/Windows/.test(ua)) return 'Windows PC';
      return 'Browser';
    };

    const utf8ToB64 = (str) => {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(bin);
    };
    const b64ToUtf8 = (b64) => {
      const bin = atob(String(b64).replace(/\s/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    };

    class SyncError extends Error {
      constructor(kind, message, status) { super(message); this.kind = kind; this.status = status; }
    }

    const ghRequest = async (cfg, method, path, body, accept) => {
      const r = parseRepo(cfg.repo);
      if (!r) throw new SyncError('config', 'Enter the repository as your-username/cellar-data.');
      const headers = { 'Authorization': `Bearer ${String(cfg.token || '').trim()}`, 'Accept': accept || 'application/vnd.github+json' };
      if (body) headers['Content-Type'] = 'application/json';
      try {
        return await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}${path}`, {
          method, headers, cache: 'no-store', body: body ? JSON.stringify(body) : undefined
        });
      } catch (e) {
        throw new SyncError('offline', 'No connection to GitHub. Changes are kept on this device and will sync when you are back online.');
      }
    };

    const errorFromResponse = async (res, ctx) => {
      let msg = '';
      try { msg = (await res.json()).message || ''; } catch (e) { /* no body */ }
      if (res.status === 401) return new SyncError('auth', 'GitHub rejected the access token (wrong, expired or revoked). Create a new token and paste it into Cloud Sync.', 401);
      if (res.status === 403 && /rate limit/i.test(msg)) return new SyncError('rate', 'GitHub is limiting requests for a few minutes. Sync will retry automatically.', 403);
      if (res.status === 403) return new SyncError('perm', 'The token is not allowed to change this repository. It needs "Contents: Read and write" access to it.', 403);
      if (res.status === 404 && ctx === 'repo') return new SyncError('notfound', 'Repository not found. Check the name, and that the token was given access to this repository.', 404);
      return new SyncError('http', `GitHub error ${res.status}${msg ? ': ' + msg : ''}`, res.status);
    };

    const contentPath = (cfg, withRef) => {
      const file = String(cfg.path || 'cellar.json').split('/').map(encodeURIComponent).join('/');
      return `/contents/${file}${withRef && cfg.branch ? `?ref=${encodeURIComponent(cfg.branch)}` : ''}`;
    };

    const ghCheckRepo = async (cfg) => {
      const res = await ghRequest(cfg, 'GET', '');
      if (!res.ok) throw await errorFromResponse(res, 'repo');
      const d = await res.json();
      return { isPrivate: !!d.private, fullName: d.full_name };
    };

    const ghReadFile = async (cfg) => {
      const res = await ghRequest(cfg, 'GET', contentPath(cfg, true));
      if (res.status === 404) return null;
      if (!res.ok) throw await errorFromResponse(res, 'file');
      const meta = await res.json();
      if (!meta.size) return { sha: meta.sha, data: null };
      let text;
      if (meta.encoding === 'base64' && meta.content) {
        text = b64ToUtf8(meta.content);
      } else {
        const raw = await ghRequest(cfg, 'GET', contentPath(cfg, true), null, 'application/vnd.github.raw+json');
        if (!raw.ok) throw await errorFromResponse(raw, 'file');
        text = await raw.text();
      }
      try { return { sha: meta.sha, data: JSON.parse(text) }; }
      catch (e) { throw new SyncError('corrupt', 'The cloud file could not be read (was it edited by hand?). Nothing was changed. Use "Replace cloud copy" to fix it.'); }
    };

    const ghWriteFile = async (cfg, doc, sha, message) => {
      const body = { message, content: utf8ToB64(JSON.stringify(doc, null, 1)) };
      if (sha) body.sha = sha;
      if (cfg.branch) body.branch = cfg.branch;
      const res = await ghRequest(cfg, 'PUT', contentPath(cfg, false), body);
      if (res.status === 409 || res.status === 422) throw new SyncError('conflict', 'Another device saved at the same moment.', res.status);
      if (!res.ok) throw await errorFromResponse(res, 'file');
      const d = await res.json();
      return d.content && d.content.sha;
    };

    const mergeTombstones = (a, b) => {
      const m = new Map();
      [...(a || []), ...(b || [])].forEach(t => {
        if (!t || !t.id) return;
        const prev = m.get(t.id);
        if (!prev || String(t.at) > String(prev.at)) m.set(t.id, { id: String(t.id), at: String(t.at || '') });
      });
      return [...m.values()];
    };

    const parseRemoteDoc = (data) => ({
      wines: normalizeList(data && data.wines),
      history: sanitizeHistory(data && data.history),
      tombstones: mergeTombstones([], data && Array.isArray(data.tombstones) ? data.tombstones : [])
    });

    // Merge two copies: newest edit of each wine wins; deletions win over older edits; logs are combined.
    const mergeState = (local, remote) => {
      const tombstones = mergeTombstones(local.tombstones, remote.tombstones);
      const tomb = new Map(tombstones.map(t => [t.id, t.at]));
      const alive = (w) => { const t = tomb.get(w.id); return !t || (w.updatedAt || '') > t; };
      const remoteById = new Map(remote.wines.map(w => [w.id, w]));
      const localIds = new Set(local.wines.map(w => w.id));
      const wines = [];
      remote.wines.forEach(w => { if (!localIds.has(w.id) && alive(w)) wines.push(w); });
      local.wines.forEach(w => {
        const r = remoteById.get(w.id);
        const winner = r && (r.updatedAt || '') > (w.updatedAt || '') ? r : w;
        if (alive(winner)) wines.push(winner);
      });
      const hMap = new Map();
      [...local.history, ...remote.history].forEach(e => {
        const prev = hMap.get(e.id);
        if (!prev || (e.editedAt || e.at) > (prev.editedAt || prev.at)) hMap.set(e.id, e);
      });
      const history = [...hMap.values()].filter(e => !tomb.has(e.id))
        .sort((x, y) => (x.at < y.at ? -1 : x.at > y.at ? 1 : 0));
      return { wines, history, tombstones };
    };

    // Order-independent fingerprint, so two devices never "ping-pong" over list order.
    const byId = (a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    const canonEvent = (e) => [e.id, e.at, e.wineId, e.change, e.balance, e.reason, e.note || '', e.editedAt || '', e.producer, e.name, e.vintage, e.varietal, e.region, e.tier, e.unitCost, e.unitValue];
    const canonical = (st) => JSON.stringify({
      w: [...st.wines].sort(byId),
      h: [...st.history].sort(byId).map(canonEvent),
      t: [...st.tombstones].sort(byId).map(t => [t.id, t.at])
    });

    const buildRemoteDoc = (st, cfg) => ({
      app: "Kiran's Cellar Tracker",
      format: 'cellar-sync',
      schemaVersion: SCHEMA_VERSION,
      updatedAt: new Date().toISOString(),
      updatedBy: cfg.deviceName || guessDeviceName(),
      wines: st.wines,
      history: st.history,
      tombstones: st.tombstones
    });

    const syncCommitMessage = (st, cfg) => {
      const bottles = sumBottles(st.wines.filter(w => !w.isWishlist));
      return `Cellar update from ${cfg.deviceName || guessDeviceName()} — ${bottles} bottles, ${st.wines.length} entries`;
    };

    const historyToCsv = (events) => '﻿' + [
      HISTORY_COLUMNS.map(c => c[0]).join(','),
      ...events.map(e => HISTORY_COLUMNS.map(c => csvCell(c[1](e))).join(','))
    ].join('\r\n');

    // ---------------------------------------------------------------------
    // SNAPSHOTS (automatic local restore points)
    // ---------------------------------------------------------------------
    const readSnapshots = () => {
      const s = readJson(SNAPSHOT_KEY, []);
      return Array.isArray(s) ? s : [];
    };
    const writeSnapshots = (list) => {
      let l = list.slice(-MAX_SNAPSHOTS);
      while (l.length) {
        if (storage.set(SNAPSHOT_KEY, JSON.stringify(l))) return l;
        l = l.slice(1); // out of space: drop the oldest and retry
      }
      storage.set(SNAPSHOT_KEY, '[]');
      return [];
    };
    const addSnapshot = (wines, label) => {
      const list = readSnapshots();
      if (!wines || wines.length === 0) return list;
      const last = list[list.length - 1];
      if (last && JSON.stringify(last.wines) === JSON.stringify(wines)) return list; // nothing changed
      list.push({ id: newId(), at: new Date().toISOString(), label, count: wines.length, bottles: sumBottles(wines.filter(w => !w.isWishlist)), wines });
      return writeSnapshots(list);
    };

    // ---------------------------------------------------------------------
    // SHARE LINK ENCODING
    // ---------------------------------------------------------------------
    const encodeShare = (list) => btoa(unescape(encodeURIComponent(JSON.stringify(list))));
    const decodeShare = (s) => JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(s.split('&')[0])))));

    // ---------------------------------------------------------------------
    // INITIAL LOAD (runs once, never overwrites anything it can't read)
    // ---------------------------------------------------------------------
    const loadInitial = () => {
      const hash = window.location.hash || '';
      let shareError = false;
      if (hash.includes('data=')) {
        try {
          const decoded = decodeShare(hash.split('data=')[1]);
          return { wines: normalizeList(decoded), readOnly: true, saveBlocked: false, message: null };
        } catch (e) {
          console.error('Error loading shared link', e);
          shareError = true;
        }
      }

      const raw = storage.get(STORAGE_KEY);
      const shareMsg = shareError ? { type: 'error', text: 'That share link could not be read (it may have been cut off when copied). Showing your own cellar instead.' } : null;
      if (raw == null) return { wines: [], readOnly: false, saveBlocked: false, message: shareMsg };

      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) throw new Error('Saved data is not a list');
        const needsMigration = parsed.some(w => !w || w._v !== SCHEMA_VERSION);
        let message = shareMsg;
        if (needsMigration && parsed.length > 0) {
          if (storage.get(PRE_MIGRATION_KEY) == null) storage.set(PRE_MIGRATION_KEY, raw);
          message = { type: 'info', text: `Your cellar (${parsed.length} entries) was upgraded to the new format. An untouched copy of the original data was kept in this browser, and a restore point was created.` };
        }
        return { wines: normalizeList(parsed), readOnly: false, saveBlocked: false, message, migrated: needsMigration, rawBefore: parsed };
      } catch (e) {
        storage.set(CORRUPT_KEY_PREFIX + Date.now(), raw);
        return {
          wines: [], readOnly: false,
          saveBlocked: true,
          message: { type: 'error', text: 'Your saved cellar data could not be read, so saving is paused and nothing has been overwritten. Download the raw data (for repair), then restore a backup file or restore point.' }
        };
      }
    };

    // ---------------------------------------------------------------------
    // CSV PARSING / EXPORT
    // ---------------------------------------------------------------------
    // Proper CSV: double-quoted fields, "" escapes, commas/newlines inside quotes.
    // Apostrophes (Tyrrell's) are ordinary characters.
    const parseCsv = (text) => {
      text = String(text).replace(/^﻿/, '');
      const rows = [];
      let row = [], field = '', inQuotes = false, wasQuoted = false;
      const endField = () => { row.push(wasQuoted ? field : field.trim()); field = ''; wasQuoted = false; };
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else inQuotes = false;
          } else field += c;
          continue;
        }
        if (c === '"' && field.trim() === '') { inQuotes = true; wasQuoted = true; field = ''; continue; }
        if (c === ',') { endField(); continue; }
        if (c === '\r') continue;
        if (c === '\n') { endField(); rows.push(row); row = []; continue; }
        field += c;
      }
      if (field !== '' || row.length) { endField(); rows.push(row); }
      return rows.filter(r => r.some(cell => String(cell).trim() !== ''));
    };

    const HEADER_ALIASES = {
      id: ['id'],
      producer: ['producer', 'winery', 'maker', 'brand'],
      name: ['name', 'wine', 'winename', 'label', 'cuvee'],
      vintage: ['vintage', 'year'],
      varietal: ['varietal', 'variety', 'grape', 'grapes'],
      region: ['region', 'appellation'],
      quantity: ['quantity', 'qty', 'bottles', 'count'],
      tier: ['tier', 'class', 'classification'],
      cost: ['costpriceaud', 'cost', 'costprice', 'costaud', 'pricepaid', 'paid', 'purchaseprice'],
      market: ['marketpriceaud', 'marketprice', 'priceaud', 'marketvalue', 'value', 'retail'],
      priceManual: ['pricemanual'],
      halliday: ['hallidayscore', 'halliday'],
      vivino: ['vivinorating', 'vivino'],
      ratingsVerified: ['ratingsverified'],
      drinkStart: ['drinkstart', 'drinkfrom'],
      drinkEnd: ['drinkend', 'drinkto', 'drinkby'],
      windowEstimated: ['windowestimated'],
      wishlist: ['iswishlist', 'wishlist'],
      notes: ['notes', 'tastingnotes', 'mynotes'],
      styleNote: ['stylenote', 'referencenote']
    };
    const normHeader = (h) => String(h).toLowerCase().replace(/[^a-z0-9]/g, '');

    const csvRowToWine = (get) => {
      const producer = get('producer') || 'Unknown Producer';
      const name = get('name') || 'Estate Wine';
      const vintage = get('vintage') || '';
      const varietal = get('varietal') || '';
      const match = findBenchmark(producer, name);

      const hs = num(get('halliday')), vr = num(get('vivino'));
      let hallidayScore = null, vivinoRating = null, ratingsVerified = false;
      if (hs !== undefined || vr !== undefined) {
        hallidayScore = hs ?? null; vivinoRating = vr ?? null;
        ratingsVerified = get('ratingsVerified') ? toBool(get('ratingsVerified')) : true;
      } else if (match) {
        hallidayScore = match.hallidayScore; vivinoRating = match.vivinoRating;
      }

      const ds = num(get('drinkStart')), de = num(get('drinkEnd'));
      let drinkStart, drinkEnd, windowEstimated;
      if (ds !== undefined && de !== undefined) {
        drinkStart = ds; drinkEnd = de;
        windowEstimated = get('windowEstimated') ? toBool(get('windowEstimated')) : false;
      } else {
        [drinkStart, drinkEnd] = estimateWindow(producer, name, varietal, vintage);
        windowEstimated = true;
      }

      const market = num(get('market'));
      const priceManual = get('priceManual') ? toBool(get('priceManual')) : market !== undefined;
      const qty = num(get('quantity'));

      return sanitize({
        id: get('id') || newId(),
        producer, name, vintage, varietal,
        region: get('region') || (match ? match.region : ''),
        quantity: qty === undefined ? 1 : qty,
        tier: get('tier'),
        costPriceAud: num(get('cost')) ?? 0,
        priceAud: market,
        priceManual,
        hallidayScore, vivinoRating, ratingsVerified,
        drinkStart, drinkEnd, windowEstimated,
        isWishlist: toBool(get('wishlist')),
        notes: get('notes') || '',
        styleNote: get('styleNote') || (match ? match.styleNote : '')
      });
    };

    const CSV_COLUMNS = ['id', 'producer', 'name', 'vintage', 'varietal', 'region', 'quantity', 'tier', 'costPriceAud', 'marketPriceAud', 'priceManual',
      'hallidayScore', 'vivinoRating', 'ratingsVerified', 'drinkStart', 'drinkEnd', 'windowEstimated', 'isWishlist', 'notes', 'styleNote'];
    const csvCell = (v) => {
      if (v === null || v === undefined) return '';
      const s = String(v);
      return /[",\r\n]|^\s|\s$/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const winesToCsv = (list) => '﻿' + [
      CSV_COLUMNS.join(','),
      ...list.map(w => CSV_COLUMNS.map(c => csvCell(c === 'marketPriceAud' ? w.priceAud : w[c])).join(','))
    ].join('\r\n');

    const parseBackupJson = (text) => {
      const data = JSON.parse(text);
      const list = Array.isArray(data) ? data : (data && Array.isArray(data.wines) ? data.wines : null);
      if (!list) throw new Error('No wines found in this file.');
      const history = (data && Array.isArray(data.history)) ? sanitizeHistory(data.history) : null;
      return { wines: normalizeList(list), history, exportedAt: (data && data.exportedAt) || null };
    };

    // ---------------------------------------------------------------------
    // DISPLAY HELPERS
    // ---------------------------------------------------------------------
    const getDrinkStatus = (wine) => {
      const start = wine.drinkStart, end = wine.drinkEnd;
      const est = wine.windowEstimated ? ' est.' : '';
      if (wine.quantity <= 0) return { label: '⚪ FINISHED', priority: 5, color: 'bg-stone-900/80 text-stone-400 border-stone-700' };
      if (start == null || end == null) return { label: '⚪ NO WINDOW SET', priority: 4, color: 'bg-stone-900/80 text-stone-400 border-stone-700' };
      if (CURRENT_YEAR > end) return { label: `🔴 DRINK NOW (peak ended ${end}${est})`, priority: 1, color: 'bg-red-950/80 text-red-300 border-red-700/60' };
      if (CURRENT_YEAR >= start) return { label: `🟢 READY (${start}–${end}${est})`, priority: 2, color: 'bg-emerald-950/80 text-emerald-300 border-emerald-700/60' };
      return { label: `🔵 CELLAR (${start}–${end}${est})`, priority: 3, color: 'bg-sky-950/80 text-sky-300 border-sky-700/60' };
    };

    const inputCls = "w-full bg-stone-900 border border-stone-700 rounded p-2 text-stone-100 focus:outline-none focus:border-amber-500";

    function ConfirmButton({ onConfirm, children, confirmLabel = 'Tap again to confirm', className = '' }) {
      const [armed, setArmed] = useState(false);
      useEffect(() => {
        if (!armed) return;
        const t = setTimeout(() => setArmed(false), 4000);
        return () => clearTimeout(t);
      }, [armed]);
      return (
        <button type="button" className={`${className} ${armed ? 'ring-2 ring-red-400' : ''}`}
          onClick={() => { if (armed) { setArmed(false); onConfirm(); } else setArmed(true); }}>
          {armed ? confirmLabel : children}
        </button>
      );
    }

    function HallidayBadge({ wine }) {
      const s = wine.hallidayScore;
      if (s == null) {
        return <span className="min-w-[1.25rem] h-5 px-0.5 rounded-full border border-dashed border-stone-600 text-stone-500 text-[10px] font-bold flex items-center justify-center" title="No Halliday score entered — tap ✏️ Edit to add one">–</span>;
      }
      const cls = wine.ratingsVerified ? 'bg-amber-500 text-stone-950 shadow' : 'border border-dashed border-amber-500 text-amber-400';
      return (
        <span className={`min-w-[1.25rem] h-5 px-0.5 rounded-full ${cls} text-[10px] font-extrabold flex items-center justify-center`}
          title={wine.ratingsVerified ? `Halliday score: ${s} (entered by you)` : `Halliday score: ~${s} — indicative estimate from the reference list, not vintage-specific. Edit to confirm.`}>
          {s}
        </span>
      );
    }

    function VivinoBadge({ wine }) {
      const r = wine.vivinoRating;
      if (r == null) {
        return <span className="border border-dashed border-stone-700 text-stone-500 px-1 rounded text-[10px] font-bold" title="No Vivino rating entered">★–</span>;
      }
      const cls = wine.ratingsVerified ? 'bg-black text-amber-400 border border-stone-800' : 'border border-dashed border-stone-500 text-stone-300';
      return (
        <span className={`${cls} px-1 rounded text-[10px] font-bold flex items-center gap-0.5`}
          title={wine.ratingsVerified ? `Vivino rating: ${r} (entered by you)` : `Vivino rating: ~${r} — indicative estimate. Edit to confirm.`}>
          ★{r}
        </span>
      );
    }

    function PriceBadge({ wine }) {
      const manual = wine.priceManual;
      return (
        <span className={`h-5 px-1.5 rounded-full text-[10px] font-extrabold flex items-center justify-center ${manual ? 'bg-emerald-600 text-stone-950 shadow' : 'border border-dashed border-emerald-500 text-emerald-400'}`}
          title={manual ? `Market price: ${fmtMoney(wine.priceAud)} (entered by you)` : `Estimated value: ${fmtMoney(wine.priceAud)} = cost × ${wine.tier} tier multiplier. Edit to enter a real market price.`}>
          {manual ? '' : '≈'}{fmtMoney(wine.priceAud)}
        </span>
      );
    }

    // ---------------------------------------------------------------------
    // ADD / EDIT FORM
    // ---------------------------------------------------------------------
    const EMPTY_FORM = {
      producer: '', name: '', vintage: String(CURRENT_YEAR - 2), region: '', varietal: '',
      quantity: '1', tier: 'Green', costPriceAud: '', priceAud: '',
      hallidayScore: '', vivinoRating: '', drinkStart: '', drinkEnd: '',
      ratingsVerified: true, windowEstimated: false, notes: '', styleNote: ''
    };

    const wineToForm = (w) => ({
      producer: w.producer, name: w.name, vintage: w.vintage, region: w.region, varietal: w.varietal,
      quantity: String(w.quantity), tier: w.tier,
      costPriceAud: w.costPriceAud ? String(w.costPriceAud) : '',
      priceAud: w.priceManual ? String(w.priceAud) : '',
      hallidayScore: w.hallidayScore == null ? '' : String(w.hallidayScore),
      vivinoRating: w.vivinoRating == null ? '' : String(w.vivinoRating),
      drinkStart: w.drinkStart == null ? '' : String(w.drinkStart),
      drinkEnd: w.drinkEnd == null ? '' : String(w.drinkEnd),
      ratingsVerified: w.ratingsVerified, windowEstimated: w.windowEstimated,
      notes: w.notes, styleNote: w.styleNote
    });

    const formToWine = (form, base = {}) => {
      let drinkStart = form.drinkStart, drinkEnd = form.drinkEnd, windowEstimated = form.windowEstimated;
      if (String(drinkStart).trim() === '' || String(drinkEnd).trim() === '') {
        [drinkStart, drinkEnd] = estimateWindow(form.producer, form.name, form.varietal, form.vintage);
        windowEstimated = true;
      }
      const hasScores = String(form.hallidayScore).trim() !== '' || String(form.vivinoRating).trim() !== '';
      const match = findBenchmark(form.producer, form.name);
      return sanitize({
        ...base,
        id: base.id || newId(),
        producer: form.producer, name: form.name, vintage: form.vintage, region: form.region, varietal: form.varietal,
        quantity: String(form.quantity).trim() === '' ? 1 : form.quantity,
        tier: form.tier,
        costPriceAud: form.costPriceAud,
        priceAud: form.priceAud,
        priceManual: String(form.priceAud).trim() !== '',
        hallidayScore: String(form.hallidayScore).trim() === '' ? null : form.hallidayScore,
        vivinoRating: String(form.vivinoRating).trim() === '' ? null : form.vivinoRating,
        ratingsVerified: hasScores ? form.ratingsVerified : false,
        drinkStart, drinkEnd, windowEstimated,
        isWishlist: !!base.isWishlist,
        notes: form.notes,
        styleNote: form.styleNote || (match ? match.styleNote : '')
      });
    };

    function WineFormModal({ title, initialForm, onSave, onClose, showDbSearch, saveLabel, wineHistory }) {
      const [form, setForm] = useState(initialForm);
      const [dbQuery, setDbQuery] = useState('');
      const results = useMemo(() => {
        const q = dbQuery.trim().toLowerCase();
        if (!q) return [];
        return BENCHMARK_DATABASE.filter(b => [b.producer, b.name, b.region, b.varietal].some(x => x.toLowerCase().includes(q)));
      }, [dbQuery]);

      const set = (key, value, extra = {}) => setForm(f => ({ ...f, [key]: value, ...extra }));
      const autoPrice = calculateMarketPrice(form.costPriceAud, form.tier, form.hallidayScore === '' ? null : form.hallidayScore);
      const [estStart, estEnd] = estimateWindow(form.producer, form.name, form.varietal, form.vintage);

      const pick = (b) => {

          hallidayScore: String(b.hallidayScore), vivinoRating: String(b.vivinoRating), ratingsVerified: false,
          drinkStart: String(v + b.drinkSpan[0]), drinkEnd: String(v + b.drinkSpan[1]), windowEstimated: true,

        }));

      return (
        <div className="fixed inset-0 bg-black/80 flex items-start md:items-center justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-lg w-full space-y-3 shadow-2xl my-8">

            {showDbSearch && (

                <label className="block text-[11px] font-semibold text-amber-400 uppercase tracking-wider">🔍 Search reference list</label>
                <input type="text" placeholder="Type Penfolds, Grosset, Leeuwin, Riesling..." value={dbQuery}

                      </div>

                )}
                <p className="text-[10px] text-stone-500">Auto-filled scores and drink windows are indicative (not vintage-specific) and show as estimates until you change them.</p>
              </div>

            <form onSubmit={(e) => { e.preventDefault(); onSave(form); }} className="space-y-3 text-xs">
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-stone-400 mb-1">Producer</label>

                </div>
                <div>

                  <input required type="text" value={form.name} onChange={e => set('name', e.target.value)} className={inputCls} />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div>

                </div>
                <div>

    // ---------------------------------------------------------------------
    // ACTIONS DROPDOWN
    // ---------------------------------------------------------------------
    function ActionsMenu({ items }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        if (!open) return;
        const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('touchstart', onDown);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('touchstart', onDown);
          document.removeEventListener('keydown', onKey);
        };
      }, [open]);
      return (
        <div className="relative" ref={ref}>
          <button type="button" aria-haspopup="menu" aria-expanded={open} onClick={() => setOpen(o => !o)}
            className={`font-bold px-3 py-1.5 rounded-lg text-xs transition shadow flex items-center gap-1 ${open ? 'bg-amber-400 text-stone-950' : 'bg-amber-600 hover:bg-amber-500 text-stone-950'}`}>
            ⚙️ Actions <span className={`transition-transform ${open ? 'rotate-180' : ''}`}>▾</span>
          </button>
          {open && (
            <div role="menu" className="absolute left-0 md:left-auto md:right-0 mt-1 w-64 bg-stone-800 border border-stone-600 rounded-lg shadow-2xl z-40 py-1">
              {items.map(it => (
                <button key={it.label} type="button" role="menuitem" onClick={() => { setOpen(false); it.onClick(); }}
                  className="w-full text-left px-3 py-2 hover:bg-stone-700 flex items-start gap-2.5">
                  <span className="text-base leading-5">{it.icon}</span>
                  <span>
                    <span className="block text-xs font-semibold text-stone-100">{it.label}</span>
                    <span className="block text-[10px] text-stone-400">{it.hint}</span>
                  </span>
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ---------------------------------------------------------------------
    // WINE HISTORY MODAL
    // ---------------------------------------------------------------------
    function HistoryModal({ history, onClose, onUpdateEvent, onDownload, canEdit }) {
      const [query, setQuery] = useState('');
      const [direction, setDirection] = useState('All');
      const [year, setYear] = useState('All');
      const [reason, setReason] = useState('All');

      const years = useMemo(() => Array.from(new Set(history.map(e => new Date(e.at).getFullYear()))).sort((a, b) => b - a), [history]);
      const reasons = useMemo(() => Array.from(new Set(history.map(e => e.reason))).sort(), [history]);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return history.filter(e => {
          if (direction === 'In' && e.change <= 0) return false;
          if (direction === 'Out' && e.change >= 0) return false;
          if (year !== 'All' && new Date(e.at).getFullYear() !== Number(year)) return false;
          if (reason !== 'All' && e.reason !== reason) return false;
          if (q && ![e.producer, e.name, e.vintage, e.varietal, e.note, e.reason].some(x => String(x || '').toLowerCase().includes(q))) return false;
          return true;
        });
      }, [history, query, direction, year, reason]);

      const bottlesIn = filtered.reduce((a, e) => a + (e.change > 0 ? e.change : 0), 0);
      const bottlesOut = filtered.reduce((a, e) => a + (e.change < 0 ? -e.change : 0), 0);
      const outByReason = {};
      filtered.forEach(e => { if (e.change < 0) outByReason[e.reason] = (outByReason[e.reason] || 0) - e.change; });
      const spendIn = filtered.reduce((a, e) => a + (e.change > 0 && e.reason !== 'Opening balance' ? e.change * (e.unitCost || 0) : 0), 0);
      const isFiltered = query || direction !== 'All' || year !== 'All' || reason !== 'All';
      const selCls = "bg-stone-900 border border-stone-700 rounded-lg px-2 py-1.5 text-xs text-stone-100 focus:outline-none focus:border-amber-500";

      return (
        <div className="fixed inset-0 bg-black/80 flex items-start md:items-center justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-4xl w-full space-y-3 shadow-2xl my-8">
            <div className="flex justify-between items-center">
              <h3 className="text-base font-bold text-amber-400">📜 Wine History — bottles in & out</h3>
              <button onClick={onClose} className="text-stone-400 hover:text-stone-200 font-bold">✕</button>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-center">
              <div className="bg-emerald-950/50 border border-emerald-800/60 rounded p-2">
                <span className="block text-lg font-bold text-emerald-300">{bottlesIn}</span>
                <span className="text-[10px] text-emerald-400">bottles in</span>
              </div>
              <div className="bg-rose-950/50 border border-rose-800/60 rounded p-2">
                <span className="block text-lg font-bold text-rose-300">{bottlesOut}</span>
                <span className="text-[10px] text-rose-400">bottles out</span>
              </div>
              <div className="bg-stone-900/80 border border-stone-700 rounded p-2">
                <span className="block text-lg font-bold text-stone-200">{fmtMoney(spendIn)}</span>
                <span className="text-[10px] text-stone-400">cost of bottles in (excl. opening)</span>
              </div>
              <div className="bg-stone-900/80 border border-stone-700 rounded p-2 text-[10px] text-stone-300 flex flex-col justify-center">
                {Object.keys(outByReason).length === 0 ? <span className="text-stone-500">No bottles out</span> :
                  Object.entries(outByReason).map(([r, n]) => <span key={r}>{r}: <strong>{n}</strong></span>)}
              </div>
            </div>

            <div className="flex flex-col md:flex-row gap-2">
              <input type="text" placeholder="Search wine, note, reason..." value={query} onChange={e => setQuery(e.target.value)} className={`${selCls} flex-1`} />
              <select value={direction} onChange={e => setDirection(e.target.value)} className={selCls}>
                <option value="All">In & Out</option><option value="In">In only</option><option value="Out">Out only</option>
              </select>
              <select value={year} onChange={e => setYear(e.target.value)} className={selCls}>
                <option value="All">All years</option>
                {years.map(y => <option key={y} value={y}>{y}</option>)}
              </select>
              <select value={reason} onChange={e => setReason(e.target.value)} className={selCls}>
                <option value="All">All reasons</option>
                {reasons.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>

            <div className="flex flex-wrap gap-2">
              <button onClick={() => onDownload(history, 'all')} className="bg-emerald-600 hover:bg-emerald-500 text-stone-950 font-bold px-3 py-1.5 rounded text-xs">⬇️ Download full history (Excel .csv)</button>
              {isFiltered && (
                <button onClick={() => onDownload(filtered, 'filtered')} className="bg-stone-700 hover:bg-stone-600 text-stone-100 font-semibold px-3 py-1.5 rounded text-xs">⬇️ Download these {filtered.length} rows</button>
              )}
            </div>

            <div className="max-h-[50vh] overflow-auto bg-stone-950 rounded border border-stone-800">
              {filtered.length === 0 ? (
                <p className="text-xs text-stone-500 p-4 text-center">No movements {isFiltered ? 'match these filters' : 'recorded yet'}.</p>
              ) : (
                <table className="w-full text-left border-collapse text-[11px]">
                  <thead className="sticky top-0 bg-stone-900">
                    <tr className="text-stone-400 border-b border-stone-800">
                      <th className="p-1.5">Date</th><th className="p-1.5">Wine</th><th className="p-1.5 text-right">Qty</th>
                      <th className="p-1.5 text-right">Bal.</th><th className="p-1.5">Reason</th><th className="p-1.5">Note</th>
                    </tr>
                  </thead>
                  <tbody>
                    {[...filtered].reverse().map(e => {
                      const options = e.change > 0 ? IN_REASONS : OUT_REASONS;
                      const editable = canEdit && e.reason !== 'Opening balance';
                      return (
                        <tr key={e.id} className="border-b border-stone-900 text-stone-300 align-top">
                          <td className="p-1.5 whitespace-nowrap text-stone-400">{fmtDateTime(e.at)}</td>
                          <td className="p-1.5"><span className="text-amber-500">{e.vintage}</span> <strong>{e.producer}</strong> {e.name}</td>
                          <td className={`p-1.5 text-right font-bold ${e.change > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{e.change > 0 ? '+' : ''}{e.change}</td>
                          <td className="p-1.5 text-right">{e.balance}</td>
                          <td className="p-1.5">
                            {editable ? (
                              <select value={e.reason} onChange={ev => onUpdateEvent(e.id, { reason: ev.target.value })}
                                className="bg-stone-900 border border-stone-700 rounded px-1 py-0.5 text-[11px] text-stone-200">
                                {(options.includes(e.reason) ? options : [e.reason, ...options]).map(r => <option key={r} value={r}>{r}</option>)}
                              </select>
                            ) : e.reason}
                          </td>
                          <td className="p-1.5 min-w-[8rem]">
                            {canEdit ? (
                              <input type="text" defaultValue={e.note} placeholder="add note"
                                onBlur={ev => { if (ev.target.value !== e.note) onUpdateEvent(e.id, { note: ev.target.value }); }}
                                className="w-full bg-transparent border-b border-stone-800 focus:border-amber-500 focus:outline-none text-[11px] text-stone-200 placeholder-stone-600" />
                            ) : e.note}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>
            <p className="text-[10px] text-stone-500">
              Every change to bottle quantities is recorded automatically. Tapping − is logged as "Drunk" and + as "Purchased" — change the reason or add a note here. The download opens directly in Excel (one row per movement; Qty Change is negative for bottles out, so it sums cleanly in a pivot table).
            </p>
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------
    // CLOUD SYNC SETTINGS MODAL
    // ---------------------------------------------------------------------
    const syncStatusLabel = (st) => {
      if (st.state === 'syncing') return '☁️ Syncing…';
      if (st.state === 'pending') return '☁️ Saving…';
      if (st.state === 'synced') return `☁️ Synced${st.at ? ' ' + new Date(st.at).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }) : ''}`;
      if (st.state === 'offline') return '☁️ Offline — will sync';
      if (st.state === 'error') return '⚠️ Sync problem';
      return '☁️ Sync off';
    };

    function SyncModal({ cfg, status, choice, localSummary, onConnect, onChoose, onCancelChoice, onSyncNow, onDisconnect, onRename, onClose }) {
      const [repo, setRepo] = useState(cfg ? cfg.repo : '');
      const [token, setToken] = useState('');
      const [deviceName, setDeviceName] = useState(cfg ? cfg.deviceName : guessDeviceName());
      const [branch, setBranch] = useState(cfg ? (cfg.branch || '') : '');
      const [path, setPath] = useState(cfg ? (cfg.path || 'cellar.json') : 'cellar.json');
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');
      const linked = !!(cfg && cfg.linkedAt);

      const connect = async (e) => {
        e.preventDefault();
        setError('');
        if (!parseRepo(repo)) { setError('Enter the repository as your-username/cellar-data (or paste its GitHub address).'); return; }
        if (!token.trim()) { setError('Paste your access token.'); return; }
        setBusy(true);
        try { await onConnect({ repo: repo.trim(), token: token.trim(), deviceName: deviceName.trim() || guessDeviceName(), branch: branch.trim(), path: path.trim() || 'cellar.json' }); }
        catch (err) { setError(err.message || String(err)); }
        finally { setBusy(false); }
      };
      const choose = async (c) => {
        setError(''); setBusy(true);
        try { await onChoose(c); } catch (err) { setError(err.message || String(err)); } finally { setBusy(false); }
      };

      const box = "bg-stone-900/80 p-3 rounded-lg border border-stone-700 space-y-2 text-xs";
      return (
        <div className="fixed inset-0 bg-black/80 flex items-start md:items-center justify-center p-4 z-50 overflow-y-auto">
          <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-xl w-full space-y-4 shadow-2xl my-8">
            <div className="flex justify-between items-center">
              <h3 className="text-base font-bold text-sky-300">☁️ Cloud Sync (GitHub)</h3>
              <button onClick={onClose} className="text-stone-400 hover:text-stone-200 font-bold">✕</button>
            </div>

            {linked && !choice && (
              <section className={box}>
                <div className="flex flex-wrap justify-between items-center gap-2">
                  <div>
                    <span className="block font-bold text-stone-100">{syncStatusLabel(status)}</span>
                    <span className="block text-[10px] text-stone-400">Repository: {cfg.repo}{cfg.path && cfg.path !== 'cellar.json' ? ` · ${cfg.path}` : ''} · this device: {cfg.deviceName}</span>
                  </div>
                  <button onClick={onSyncNow} className="bg-sky-600 hover:bg-sky-500 text-stone-950 font-bold px-3 py-1.5 rounded">Sync now</button>
                </div>
                {status.state === 'error' && <div className="p-2 bg-red-950/80 border border-red-700 text-red-200 rounded">⚠️ {status.message}</div>}
                {status.state === 'offline' && <div className="p-2 bg-amber-950/60 border border-amber-700/60 text-amber-100 rounded">{status.message}</div>}
                <p className="text-[10px] text-stone-400">Changes upload about 3 seconds after you make them. Other devices pick them up when the tracker is opened or brought back to the screen, and every 30 seconds while it's open. Every save is a dated version in your repository's commit history.</p>
                <div className="flex flex-wrap gap-2 items-center">
                  <label className="text-[10px] text-stone-400">Device name</label>
                  <input type="text" defaultValue={cfg.deviceName} onBlur={e => e.target.value.trim() && onRename(e.target.value.trim())}
                    className="bg-stone-950 border border-stone-700 rounded px-2 py-1 text-xs text-stone-100 w-40" />
                  <ConfirmButton onConfirm={onDisconnect} className="ml-auto bg-stone-700 hover:bg-stone-600 text-stone-200 px-3 py-1.5 rounded" confirmLabel="Tap again to disconnect">
                    Disconnect this device
                  </ConfirmButton>
                </div>
                <p className="text-[10px] text-stone-500">Disconnecting removes the token from this browser only. Your cellar stays on this device and in GitHub. To update an expired token, disconnect and connect again.</p>
              </section>
            )}

            {choice && (
              <section className={box}>
                <h4 className="font-bold text-amber-300">This device and the cloud both have a cellar. Which should be used?</h4>
                <div className="grid grid-cols-2 gap-2 text-[11px]">
                  <div className="bg-stone-950 border border-stone-700 rounded p-2">
                    <span className="block font-bold text-sky-300">Cloud copy</span>
                    {choice.summary.entries} entries · {choice.summary.bottles} bottles · {choice.summary.history} log rows
                    {choice.summary.updatedBy && <span className="block text-stone-500">last saved by {choice.summary.updatedBy}{choice.summary.updatedAt ? `, ${fmtDateTime(choice.summary.updatedAt)}` : ''}</span>}
                  </div>
                  <div className="bg-stone-950 border border-stone-700 rounded p-2">
                    <span className="block font-bold text-emerald-300">This device</span>
                    {localSummary.entries} entries · {localSummary.bottles} bottles · {localSummary.history} log rows
                  </div>
                </div>
                <div className="space-y-1.5">
                  <button disabled={busy} onClick={() => choose('cloud')} className="w-full text-left bg-sky-700 hover:bg-sky-600 disabled:opacity-50 text-stone-100 px-3 py-2 rounded">
                    <strong>Use the cloud copy on this device</strong> <span className="text-[10px] opacity-80">(recommended for a second device — this device's copy is kept as a restore point)</span>
                  </button>
                  <button disabled={busy} onClick={() => choose('merge')} className="w-full text-left bg-stone-700 hover:bg-stone-600 disabled:opacity-50 text-stone-100 px-3 py-2 rounded">
                    <strong>Combine both</strong> <span className="text-[10px] opacity-80">(only if each device has different wines — the same wine entered on both will appear twice)</span>
                  </button>
                  <ConfirmButton onConfirm={() => choose('upload')} className="w-full text-left bg-rose-800 hover:bg-rose-700 text-stone-100 px-3 py-2 rounded" confirmLabel="Tap again — the cloud copy will be replaced (older versions stay in GitHub history)">
                    <strong>Replace the cloud copy with this device</strong>
                  </ConfirmButton>
                  <button onClick={onCancelChoice} className="text-[11px] text-stone-400 underline">Cancel</button>
                </div>
              </section>
            )}

            {!linked && !choice && (
              <>
                <section className={box}>
                  <h4 className="font-bold text-stone-100">Before you start (one-off, on GitHub)</h4>
                  <ol className="list-decimal ml-4 space-y-1 text-stone-300">
                    <li>Create a <strong>private</strong> repository, e.g. <code>cellar-data</code>, and tick "Add a README file". <a className="text-sky-400 underline" href="https://github.com/new" target="_blank" rel="noopener">github.com/new</a></li>
                    <li>Create a <strong>fine-grained token</strong>: Repository access → Only select repositories → <code>cellar-data</code>; Permissions → Contents → <strong>Read and write</strong>. <a className="text-sky-400 underline" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create token</a></li>
                    <li>Copy the token (starts with <code>github_pat_</code>) and paste it below.</li>
                  </ol>
                </section>
                <form onSubmit={connect} className={box}>
                  <div>
                    <label className="block text-stone-400 mb-1">Repository</label>
                    <input type="text" value={repo} onChange={e => setRepo(e.target.value)} placeholder="your-username/cellar-data" autoCapitalize="off" autoCorrect="off" spellCheck="false" className={inputCls} />
                  </div>
                  <div>
                    <label className="block text-stone-400 mb-1">Access token</label>
                    <input type="password" value={token} onChange={e => setToken(e.target.value)} placeholder="github_pat_…" autoComplete="off" autoCapitalize="off" spellCheck="false" className={inputCls} />
                    <span className="block text-[10px] text-stone-500 mt-1">Saved in this browser only. Never included in backups or share links.</span>
                  </div>
                  <div>
                    <label className="block text-stone-400 mb-1">Name for this device</label>
                    <input type="text" value={deviceName} onChange={e => setDeviceName(e.target.value)} className={inputCls} />
                  </div>
                  <details className="text-[11px] text-stone-400">
                    <summary className="cursor-pointer">Advanced</summary>
                    <div className="grid grid-cols-2 gap-2 mt-2">
                      <div>
                        <label className="block mb-1">Branch (blank = default)</label>
                        <input type="text" value={branch} onChange={e => setBranch(e.target.value)} className={inputCls} />
                      </div>
                      <div>
                        <label className="block mb-1">File name</label>
                        <input type="text" value={path} onChange={e => setPath(e.target.value)} className={inputCls} />
                      </div>
                    </div>
                  </details>
                  <button type="submit" disabled={busy} className="bg-sky-600 hover:bg-sky-500 disabled:opacity-50 text-stone-950 font-bold px-4 py-2 rounded">
                    {busy ? 'Connecting…' : 'Connect'}
                  </button>
                </form>
              </>
            )}

            {error && <div className="p-2 bg-red-950/80 border border-red-700 text-red-200 rounded text-xs">⚠️ {error}</div>}
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------
    // ERROR BOUNDARY — if anything crashes, your stored data is untouched
    // ---------------------------------------------------------------------
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      render() {
        if (this.state.error) {
          return (
            <div className="max-w-xl mx-auto p-6 space-y-3">
              <h1 className="text-xl font-bold text-amber-500">Something went wrong</h1>
              <p className="text-sm text-stone-300">Your saved cellar data has not been changed. Download a raw copy first, then reload.</p>
              <div className="flex gap-2">
                <button onClick={() => downloadFile(`cellar-raw-${localDate()}.json`, storage.get(STORAGE_KEY) || '[]', 'application/json')}
                  className="bg-emerald-600 text-stone-950 font-bold px-3 py-1.5 rounded text-xs">Download raw data</button>
                <button onClick={() => window.location.reload()} className="bg-stone-700 px-3 py-1.5 rounded text-xs">Reload</button>
              </div>
              <pre className="text-[10px] text-stone-500 whitespace-pre-wrap">{String(this.state.error)}</pre>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ---------------------------------------------------------------------
    // MAIN APP
    // ---------------------------------------------------------------------
    function WineApp() {
      const [boot] = useState(loadInitial);
      const [wines, setWines] = useState(boot.wines);
      const [isReadOnly, setIsReadOnly] = useState(boot.readOnly);
      const [saveBlocked, setSaveBlocked] = useState(boot.saveBlocked);
      const [notice, setNotice] = useState(boot.message);
      const [saveError, setSaveError] = useState(false);
      const [snapshots, setSnapshots] = useState(readSnapshots);
      const [meta, setMeta] = useState(() => readJson(META_KEY, {}) || {});
      const [persistState, setPersistState] = useState('checking');
      const [reminderDismissed, setReminderDismissed] = useState(false);
      const [toast, setToast] = useState(null);

      const [activeTab, setActiveTab] = useState('cellar');
      const [shareSuccess, setShareSuccess] = useState(false);
      const [shareFallbackUrl, setShareFallbackUrl] = useState('');

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedVarietal, setSelectedVarietal] = useState('All');
      const [selectedTier, setSelectedTier] = useState('All');
      const [sortByDrinkWindow, setSortByDrinkWindow] = useState(false);

      const [selectedWineForTasting, setSelectedWineForTasting] = useState(null);
      const [tastingNoteInput, setTastingNoteInput] = useState('');
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingWine, setEditingWine] = useState(null);
      const [showWishlistModal, setShowWishlistModal] = useState(false);
      const [showCsvModal, setShowCsvModal] = useState(false);
      const [showBackupModal, setShowBackupModal] = useState(false);

      const [csvPreview, setCsvPreview] = useState([]);
      const [csvFileName, setCsvFileName] = useState('');
      const [csvError, setCsvError] = useState('');

      const [restorePreview, setRestorePreview] = useState(null);
      const [restoreError, setRestoreError] = useState('');

      const [wishlistForm, setWishlistForm] = useState({ vintage: String(CURRENT_YEAR - 2), producer: '', varietal: '', name: '' });

      // --- Movement history state (stored separately, in the background) ---
      const loadHistoryFor = (cellar) => {
        const raw = storage.get(HISTORY_KEY);
        if (raw != null) {
          try {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return { history: sanitizeHistory(parsed), fresh: false };
          } catch (e) { /* fall through */ }
          storage.set(CORRUPT_KEY_PREFIX + 'history_' + Date.now(), raw);
        }
        return { history: openingBalance(cellar), fresh: true };
      };
      const [history, setHistory] = useState(() => (boot.readOnly || boot.saveBlocked) ? [] : loadHistoryFor(boot.wines).history);
      const [showHistoryModal, setShowHistoryModal] = useState(false);

      const lastSavedRef = useRef(boot.readOnly ? null : storage.get(STORAGE_KEY));
      const lastSavedHistoryRef = useRef(boot.readOnly ? null : storage.get(HISTORY_KEY));
      const readOnlyRef = useRef(isReadOnly);
      readOnlyRef.current = isReadOnly;
      const winesRef = useRef(wines);
      winesRef.current = wines;
      const historyRef = useRef(history);
      historyRef.current = history;
      const saveBlockedRef = useRef(saveBlocked);
      saveBlockedRef.current = saveBlocked;

      // Deleted wines / log rows are remembered (as "tombstones") so deletions also sync to other devices.
      const [tombstones, setTombstones] = useState(() => { const t = readJson(TOMBSTONE_KEY, []); return Array.isArray(t) ? t : []; });
      const tombstonesRef = useRef(tombstones);
      tombstonesRef.current = tombstones;
      const lastSavedTombRef = useRef(storage.get(TOMBSTONE_KEY));
      const addTombstones = (ids) => {
        if (!ids.length) return;
        const at = new Date().toISOString();
        const next = mergeTombstones(tombstonesRef.current, ids.map(id => ({ id, at })));
        tombstonesRef.current = next;
        setTombstones(next);
      };

      // --- Cloud sync state ----------------------------------------------
      const [syncCfg, setSyncCfg] = useState(() => readJson(SYNC_KEY, null));
      const [syncStatus, setSyncStatus] = useState({ state: 'off', message: '', at: null });
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [syncChoice, setSyncChoice] = useState(null);
      const syncCfgRef = useRef(syncCfg);
      syncCfgRef.current = syncCfg;
      const syncingRef = useRef(false);
      const resyncRef = useRef(false);
      const lastSyncedCanonRef = useRef(null);
      const lastSyncStartRef = useRef(0);
      const syncLinked = !!(syncCfg && syncCfg.linkedAt && syncCfg.token);

      // Every change to the cellar goes through commit(), which also logs bottle movements,
      // time-stamps edited wines and records deletions (both needed for syncing).
      const commit = (updater, reason, opts = {}) => {
        const prev = winesRef.current;
        let next = typeof updater === 'function' ? updater(prev) : updater;
        if (next === prev) return [];
        const now = new Date().toISOString();
        const prevById = new Map(prev.map(w => [w.id, w]));
        next = next.map(w => {
          const p = prevById.get(w.id);
          if (p === w) return w;
          if (p && JSON.stringify({ ...p, updatedAt: '' }) === JSON.stringify({ ...w, updatedAt: '' })) return w.updatedAt === p.updatedAt ? w : { ...w, updatedAt: p.updatedAt };
          return { ...w, updatedAt: now };
        });
        const nextIds = new Set(next.map(w => w.id));
        addTombstones(prev.filter(w => !nextIds.has(w.id)).map(w => w.id));
        winesRef.current = next;
        setWines(next);
        if (readOnlyRef.current || opts.noLog || !reason) return [];
        const events = diffMovements(prev, next, reason);
        if (events.length) setHistory(h => appendEvents(h, events));
        return events;
      };

      const replaceHistory = (next) => {
        const keep = new Set(next.map(e => e.id));
        addTombstones(historyRef.current.filter(e => !keep.has(e.id)).map(e => e.id));
        historyRef.current = next;
        setHistory(next);
      };

      // --- Save to browser storage whenever wines / history change --------
      useEffect(() => {
        if (isReadOnly || saveBlocked) return;
        const json = JSON.stringify(wines);
        if (json === lastSavedRef.current) return;
        const ok = storage.set(STORAGE_KEY, json);
        if (ok) lastSavedRef.current = json;
        setSaveError(!ok);
      }, [wines, isReadOnly, saveBlocked]);

      useEffect(() => {
        if (isReadOnly || saveBlocked) return;
        const json = JSON.stringify(history);
        if (json === lastSavedHistoryRef.current) return;
        const ok = storage.set(HISTORY_KEY, json);
        if (ok) lastSavedHistoryRef.current = json;
        else setSaveError(true);
      }, [history, isReadOnly, saveBlocked]);

      useEffect(() => {
        if (isReadOnly || saveBlocked) return;
        const json = JSON.stringify(tombstones);
        if (json === lastSavedTombRef.current) return;
        if (storage.set(TOMBSTONE_KEY, json)) lastSavedTombRef.current = json;
      }, [tombstones, isReadOnly, saveBlocked]);

      // --- Restore point on first load each day (and after an upgrade) ---
      useEffect(() => {
        if (boot.readOnly || boot.saveBlocked) return;
        if (boot.migrated && boot.rawBefore && boot.rawBefore.length) {
          setSnapshots(addSnapshot(boot.rawBefore, 'Before upgrade to new format'));
        }
        const today = localDate();
        const hasToday = readSnapshots().some(s => /^Daily/.test(s.label) && localDate(new Date(s.at)) === today);
        if (!hasToday && boot.wines.length) setSnapshots(addSnapshot(boot.wines, 'Daily — start of day'));
      }, []);

      // --- Ask the browser not to evict our storage ----------------------
      useEffect(() => {
        const s = navigator.storage;
        if (!s || !s.persist || !s.persisted) { setPersistState('unsupported'); return; }
        s.persisted()
          .then(p => p ? true : s.persist())
          .then(granted => setPersistState(granted ? 'granted' : 'denied'))
          .catch(() => setPersistState('unsupported'));
      }, []);

      // --- Keep multiple open tabs in sync (prevents one tab overwriting another)
      useEffect(() => {
        const onStorage = (e) => {
          if (e.newValue == null || readOnlyRef.current) return;
          try {
            const parsed = JSON.parse(e.newValue);
            if (!Array.isArray(parsed)) return;
            if (e.key === STORAGE_KEY) {
              const normalized = normalizeList(parsed);
              lastSavedRef.current = JSON.stringify(normalized);
              winesRef.current = normalized;
              setWines(normalized);
            } else if (e.key === HISTORY_KEY) {
              const h = sanitizeHistory(parsed);
              lastSavedHistoryRef.current = JSON.stringify(h);
              historyRef.current = h;
              setHistory(h);
            } else if (e.key === TOMBSTONE_KEY) {
              const t = mergeTombstones([], parsed);
              lastSavedTombRef.current = JSON.stringify(t);
              tombstonesRef.current = t;
              setTombstones(t);
            }
          } catch (err) { /* ignore unreadable external writes */ }
        };
        window.addEventListener('storage', onStorage);

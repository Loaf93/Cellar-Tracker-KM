<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiran's Cellar Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CURRENT_YEAR = 2026;
    const FRIDGE_CAPACITY = 166;

    // Classification Tier Colors & Dot Styles
    const TIER_COLORS = {
      Green: "bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.8)]",
      Yellow: "bg-amber-400 shadow-[0_0_6px_rgba(251,191,36,0.8)]",
      Blue: "bg-sky-400 shadow-[0_0_6px_rgba(56,189,248,0.8)]",
      Red: "bg-rose-500 shadow-[0_0_6px_rgba(244,63,94,0.8)]"
    };

    // Benchmark Australian Wine Database for Lookup & Auto-Enrichment
    const BENCHMARK_DATABASE = [
      { producer: "Penfolds", name: "Grange Shiraz", region: "Multi-Regional SA", varietal: "Shiraz", tier: "Red", priceMultiple: 1.25, hallidayScore: 99, vivinoRating: 4.8, drinkSpan: [8, 35] },
      { producer: "Penfolds", name: "St Henri Shiraz", region: "Barossa Valley", varietal: "Shiraz", tier: "Red", priceMultiple: 1.15, hallidayScore: 96, vivinoRating: 4.4, drinkSpan: [6, 25] },
      { producer: "Leeuwin Estate", name: "Art Series Chardonnay", region: "Margaret River", varietal: "Chardonnay", tier: "Red", priceMultiple: 1.20, hallidayScore: 98, vivinoRating: 4.6, drinkSpan: [3, 14] },
      { producer: "Grosset", name: "Polish Hill Riesling", region: "Clare Valley", varietal: "Riesling", tier: "Blue", priceMultiple: 1.15, hallidayScore: 96, vivinoRating: 4.3, drinkSpan: [2, 20] },
      { producer: "Tyrrell's", name: "Vat 1 Semillon", region: "Hunter Valley", varietal: "Semillon", tier: "Yellow", priceMultiple: 1.25, hallidayScore: 98, vivinoRating: 4.3, drinkSpan: [1, 15] },
      { producer: "Clonakilla", name: "Shiraz Viognier", region: "Murrumbateman", varietal: "Shiraz", tier: "Red", priceMultiple: 1.20, hallidayScore: 97, vivinoRating: 4.5, drinkSpan: [4, 18] },
      { producer: "Mount Mary", name: "Quintet Cabernet Blend", region: "Yarra Valley", varietal: "Cabernet Sauvignon", tier: "Red", priceMultiple: 1.20, hallidayScore: 97, vivinoRating: 4.5, drinkSpan: [5, 22] },
      { producer: "Moss Wood", name: "Cabernet Sauvignon", region: "Margaret River", varietal: "Cabernet Sauvignon", tier: "Red", priceMultiple: 1.15, hallidayScore: 96, vivinoRating: 4.4, drinkSpan: [5, 20] },
      { producer: "Golden Grove", name: "Estate Chardonnay", region: "Granite Belt", varietal: "Chardonnay", tier: "Green", priceMultiple: 1.10, hallidayScore: 91, vivinoRating: 3.9, drinkSpan: [1, 4] }
    ];

    const INITIAL_WINES = [
      {
        id: '1',
        name: "Polish Hill Riesling",
        producer: "Grosset",
        vintage: "2026",
        region: "Clare Valley",
        varietal: "Riesling",
        quantity: 3,
        tier: "Blue",
        priceAud: 85,
        costPriceAud: 75,
        hallidayScore: 96,
        vivinoRating: 4.2,
        drinkStart: 2028,
        drinkEnd: 2045,
        isWishlist: false,
        notes: "Cellar up to 20 years. Piercing acidity."
      },
      {
        id: '2',
        name: "Art Series Chardonnay",
        producer: "Leeuwin Estate",
        vintage: "2022",
        region: "Margaret River",
        varietal: "Chardonnay",
        quantity: 2,
        tier: "Red",
        priceAud: 155,
        costPriceAud: 130,
        hallidayScore: 97,
        vivinoRating: 4.5,
        drinkStart: 2025,
        drinkEnd: 2034,
        isWishlist: false,
        notes: "Rich, complex, perfectly balanced oak."
      },
      {
        id: '3',
        name: "St Henri Shiraz",
        producer: "Penfolds",
        vintage: "2022",
        region: "Barossa Valley",
        varietal: "Shiraz",
        quantity: 2,
        tier: "Red",
        priceAud: 138,
        costPriceAud: 120,
        hallidayScore: 96,
        vivinoRating: 4.4,
        drinkStart: 2028,
        drinkEnd: 2050,
        isWishlist: false,
        notes: "Plush mid-palate, exceptional aging potential."
      },
      {
        id: '4',
        name: "Vat 1 Semillon",
        producer: "Tyrrell's",
        vintage: "2025",
        region: "Hunter Valley",
        varietal: "Semillon",
        quantity: 1,
        tier: "Yellow",
        priceAud: 80,
        costPriceAud: 65,
        hallidayScore: 98,
        vivinoRating: 4.3,
        drinkStart: 2025,
        drinkEnd: 2027,
        isWishlist: false,
        notes: "At peak freshness! Drink soon."
      },
      {
        id: '5',
        name: "Estate Chardonnay",
        producer: "Golden Grove",
        vintage: "2024",
        region: "Granite Belt",
        varietal: "Chardonnay",
        quantity: 2,
        tier: "Green",
        priceAud: 35,
        costPriceAud: 30,
        hallidayScore: 91,
        vivinoRating: 3.9,
        drinkStart: 2025,
        drinkEnd: 2028,
        isWishlist: false,
        notes: "Granitic mineral grip, pale straw."
      },
      {
        id: '6',
        name: "Carrodus Viognier",
        producer: "Yarra Yering",
        vintage: "2023",
        region: "Yarra Valley",
        varietal: "Viognier",
        quantity: 0,
        tier: "Blue",
        priceAud: 110,
        costPriceAud: 100,
        hallidayScore: 95,
        vivinoRating: 4.2,
        drinkStart: 2026,
        drinkEnd: 2032,
        isWishlist: true,
        notes: "Benchmark Viognier recommendation."
      }
    ];

    // Helper: Calculate Deterministic Market Value (Prevents Compounding Bug)
    const calculateMarketPrice = (costPrice, tier, halliday, vivino) => {
      const baseCost = Number(costPrice) || 30;
      let multiplier = 1.15; // default 15% markup

      if (tier === 'Red') multiplier = 1.25;
      else if (tier === 'Blue') multiplier = 1.20;
      else if (tier === 'Yellow') multiplier = 1.15;
      else if (tier === 'Green') multiplier = 1.10;

      // Minor adjustment based on Halliday score
      const hallidayBonus = (Number(halliday) >= 96) ? 0.05 : 0;
      return Math.round(baseCost * (multiplier + hallidayBonus));
    };

    function WineApp() {
      const [wines, setWines] = useState([]);
      const [activeTab, setActiveTab] = useState('cellar');
      const [isReadOnly, setIsReadOnly] = useState(false);
      const [shareSuccess, setShareSuccess] = useState(false);
      const [refreshSuccess, setRefreshSuccess] = useState(false);

      // Filters & Sorting
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedVarietal, setSelectedVarietal] = useState('All');
      const [selectedTier, setSelectedTier] = useState('All');
      const [sortByDrinkWindow, setSortByDrinkWindow] = useState(false);

      // Modals
      const [selectedWineForTasting, setSelectedWineForTasting] = useState(null);
      const [tastingNoteInput, setTastingNoteInput] = useState('');
      const [showAddModal, setShowAddModal] = useState(false);
      const [showWishlistModal, setShowWishlistModal] = useState(false);
      const [showCsvModal, setShowCsvModal] = useState(false);

      // Search Lookup in Add Modal
      const [dbSearchQuery, setDbSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);

      // CSV Import State
      const [csvParsedWines, setCsvParsedWines] = useState([]);
      const [csvFileName, setCsvFileName] = useState('');
      const [csvError, setCsvError] = useState('');

      // Form State for Add Cellar
      const [newWine, setNewWine] = useState({
        producer: '',
        name: '',
        vintage: '2024',
        region: '',
        varietal: 'Chardonnay',
        quantity: 1,
        tier: 'Green',
        priceAud: 35,
        costPriceAud: 30,
        hallidayScore: 92,
        vivinoRating: 4.1,
        drinkStart: 2026,
        drinkEnd: 2030,
        notes: ''
      });

      // Quick Wishlist Form
      const [wishlistForm, setWishlistForm] = useState({
        vintage: '2024',
        producer: '',
        varietal: 'Shiraz',
        name: ''
      });

      useEffect(() => {
        if (window.location.hash && window.location.hash.includes('data=')) {
          try {
            const encoded = window.location.hash.split('data=')[1];
            const decoded = JSON.parse(decodeURIComponent(escape(atob(encoded))));
            setWines(decoded);
            setIsReadOnly(true);
            return;
          } catch (e) {
            console.error("Error loading hash data", e);
          }
        }

        const saved = localStorage.getItem('kirans_cellar_wines_v2');
        if (saved) {
          setWines(JSON.parse(saved));
        } else {
          setWines(INITIAL_WINES);
        }
      }, []);

      useEffect(() => {
        if (!isReadOnly && wines.length > 0) {
          localStorage.setItem('kirans_cellar_wines_v2', JSON.stringify(wines));
        }
      }, [wines, isReadOnly]);

      const updateQuantity = (id, delta) => {
        if (isReadOnly) return;
        setWines(prev => prev.map(w => w.id === id ? { ...w, quantity: Math.max(0, w.quantity + delta) } : w));
      };

      const deleteWine = (id) => {
        if (isReadOnly) return;
        setWines(prev => prev.filter(w => w.id !== id));
      };

      const moveToCellar = (id) => {
        if (isReadOnly) return;
        setWines(prev => prev.map(w => w.id === id ? { ...w, isWishlist: false, quantity: Math.max(1, w.quantity) } : w));
      };

      const handleShareLink = () => {
        const cellarOnly = wines.filter(w => !w.isWishlist);
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(cellarOnly))));
        const shareUrl = `${window.location.origin}${window.location.pathname}#data=${encoded}`;
        navigator.clipboard.writeText(shareUrl);
        setShareSuccess(true);
        setTimeout(() => setShareSuccess(false), 3000);
      };

      // SYSTEM-WIDE REFRESH (Fixed against runaway price growth)
      const handleRefreshData = () => {
        if (isReadOnly) return;

        setWines(prev => prev.map(wine => {
          const match = BENCHMARK_DATABASE.find(b => 
            b.producer.toLowerCase() === wine.producer.toLowerCase() &&
            b.name.toLowerCase() === wine.name.toLowerCase()
          );

          const updatedHalliday = match ? match.hallidayScore : (wine.hallidayScore || 92);
          const updatedVivino = match ? match.vivinoRating : (wine.vivinoRating || 4.1);
          const updatedRegion = match ? match.region : wine.region;

          // Deterministic price calculation based strictly on cost price & tier
          const updatedPrice = calculateMarketPrice(wine.costPriceAud, wine.tier, updatedHalliday, updatedVivino);

          const vintageYear = Number(wine.vintage) || CURRENT_YEAR;
          const drinkStart = match ? (vintageYear + match.drinkSpan[0]) : (wine.drinkStart || vintageYear + 2);
          const drinkEnd = match ? (vintageYear + match.drinkSpan[1]) : (wine.drinkEnd || vintageYear + 8);

          return {
            ...wine,
            region: updatedRegion,
            hallidayScore: updatedHalliday,
            vivinoRating: updatedVivino,
            priceAud: updatedPrice,
            drinkStart,
            drinkEnd
          };
        }));

        setRefreshSuccess(true);
        setTimeout(() => setRefreshSuccess(false), 3000);
      };

      // Search Database for Auto-Fill
      const handleDbSearch = (query) => {
        setDbSearchQuery(query);
        if (!query.trim()) {
          setSearchResults([]);
          return;
        }
        const matches = BENCHMARK_DATABASE.filter(item => 
          item.producer.toLowerCase().includes(query.toLowerCase()) ||
          item.name.toLowerCase().includes(query.toLowerCase()) ||
          item.region.toLowerCase().includes(query.toLowerCase()) ||
          item.varietal.toLowerCase().includes(query.toLowerCase())
        );
        setSearchResults(matches);
      };

      const selectDbItem = (item) => {
        const cost = newWine.costPriceAud || 50;
        const calcPrice = calculateMarketPrice(cost, item.tier, item.hallidayScore, item.vivinoRating);
        const vYear = Number(newWine.vintage) || CURRENT_YEAR;

        setNewWine({
          ...newWine,
          producer: item.producer,
          name: item.name,
          region: item.region,
          varietal: item.varietal,
          tier: item.tier,
          priceAud: calcPrice,
          hallidayScore: item.hallidayScore,
          vivinoRating: item.vivinoRating,
          drinkStart: vYear + item.drinkSpan[0],
          drinkEnd: vYear + item.drinkSpan[1]
        });
        setSearchResults([]);
        setDbSearchQuery('');
      };

      const handleAddWine = (e) => {
        e.preventDefault();
        const created = {
          ...newWine,
          id: Date.now().toString(),
          quantity: Number(newWine.quantity),
          priceAud: Number(newWine.priceAud),
          costPriceAud: Number(newWine.costPriceAud),
          hallidayScore: Number(newWine.hallidayScore),
          vivinoRating: Number(newWine.vivinoRating),
          drinkStart: Number(newWine.drinkStart),
          drinkEnd: Number(newWine.drinkEnd),
          isWishlist: false
        };
        setWines(prev => [created, ...prev]);
        setShowAddModal(false);
      };

      const handleAddWishlist = (e) => {
        e.preventDefault();
        const created = {
          id: Date.now().toString(),
          producer: wishlistForm.producer,
          name: wishlistForm.name || wishlistForm.varietal,
          vintage: wishlistForm.vintage,
          varietal: wishlistForm.varietal,
          region: 'TBD',
          quantity: 0,
          tier: 'Yellow',
          priceAud: 0,
          costPriceAud: 0,
          hallidayScore: 90,
          vivinoRating: 4.0,
          drinkStart: CURRENT_YEAR,
          drinkEnd: CURRENT_YEAR + 5,
          isWishlist: true,
          notes: 'Added from Quick Wishlist'
        };
        setWines(prev => [created, ...prev]);
        setShowWishlistModal(false);
        setWishlistForm({ vintage: '2024', producer: '', varietal: 'Shiraz', name: '' });
      };

      // 7-COLUMN SIMPLIFIED CSV IMPORTER WITH AUTO-ENRICHMENT
      const parseCsvFile = (file) => {
        setCsvError('');
        setCsvFileName(file.name);
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) {
              setCsvError('CSV file appears to be empty or missing headers.');
              return;
            }

            const parseRow = (line) => {
              const result = [];
              let insideQuote = false;
              let entry = '';
              for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"' || char === "'") {
                  insideQuote = !insideQuote;
                } else if (char === ',' && !insideQuote) {
                  result.push(entry.trim().replace(/^["']|["']$/g, ''));
                  entry = '';
                } else {
                  entry += char;
                }
              }
              result.push(entry.trim().replace(/^["']|["']$/g, ''));
              return result;
            };

            const headers = parseRow(lines[0]).map(h => h.toLowerCase());
            const parsedRows = [];

            for (let i = 1; i < lines.length; i++) {
              const row = parseRow(lines[i]);
              if (row.length === 0 || (row.length === 1 && !row[0])) continue;

              const getValue = (keyName) => {
                const idx = headers.indexOf(keyName.toLowerCase());
                return idx !== -1 ? row[idx] : undefined;
              };

              const producer = getValue('producer') || 'Unknown Producer';
              const name = getValue('name') || getValue('wine') || 'Estate Wine';
              const vintage = getValue('vintage') || '2024';
              const varietal = getValue('varietal') || 'Red Blend';
              const quantity = Number(getValue('quantity') || 1);
              const tier = ['Green', 'Yellow', 'Blue', 'Red'].includes(getValue('tier')) ? getValue('tier') : 'Green';
              const costPriceAud = Number(getValue('costpriceaud') || getValue('cost') || 30);

              // Auto-Enrichment from Benchmark DB or Intelligent Rules
              const match = BENCHMARK_DATABASE.find(b => 
                b.producer.toLowerCase() === producer.toLowerCase() &&
                b.name.toLowerCase() === name.toLowerCase()
              );

              const region = match ? match.region : 'Australia';
              const hallidayScore = match ? match.hallidayScore : 92;
              const vivinoRating = match ? match.vivinoRating : 4.1;
              const priceAud = calculateMarketPrice(costPriceAud, tier, hallidayScore, vivinoRating);

              const vYear = Number(vintage) || CURRENT_YEAR;
              const drinkStart = match ? (vYear + match.drinkSpan[0]) : (vYear + 2);
              const drinkEnd = match ? (vYear + match.drinkSpan[1]) : (vYear + 8);

              parsedRows.push({
                id: (Date.now() + i).toString(),
                producer,
                name,
                vintage,
                region,
                varietal,
                quantity,
                tier,
                priceAud,
                costPriceAud,
                hallidayScore,
                vivinoRating,
                drinkStart,
                drinkEnd,
                isWishlist: false,
                notes: 'Imported via 7-Column CSV'
              });
            }

            if (parsedRows.length === 0) {
              setCsvError('No valid rows could be extracted.');
            } else {
              setCsvParsedWines(parsedRows);
            }
          } catch (err) {
            setCsvError('Failed to parse CSV file. Check formatting.');
          }
        };
        reader.readAsText(file);
      };

      const handleCsvFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) parseCsvFile(file);
      };

      const handleConfirmCsvImport = () => {
        if (csvParsedWines.length > 0) {
          setWines(prev => [...csvParsedWines, ...prev]);
          setShowCsvModal(false);
          setCsvParsedWines([]);
          setCsvFileName('');
        }
      };

      const downloadCsvTemplate = () => {
        const csvContent = "producer,name,vintage,varietal,quantity,tier,costPriceAud\n" +
          "Penfolds,St Henri Shiraz,2022,Shiraz,2,Red,120\n" +
          "Grosset,Polish Hill Riesling,2026,Riesling,3,Blue,75\n" +
          "Golden Grove,Estate Chardonnay,2024,Chardonnay,2,Green,30";
        
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "cellar_import_7col.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const addTastingNote = () => {
        if (!selectedWineForTasting || !tastingNoteInput) return;
        setWines(prev => prev.map(w => {
          if (w.id === selectedWineForTasting.id) {
            const dateStr = new Date().toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
            return {
              ...w,
              notes: w.notes ? `${w.notes} | [${dateStr}]: ${tastingNoteInput}` : `[${dateStr}]: ${tastingNoteInput}`
            };
          }
          return w;
        }));
        setSelectedWineForTasting(null);
        setTastingNoteInput('');
      };

      const getDrinkStatus = (start, end) => {
        if (CURRENT_YEAR > end) {
          return { label: "🔴 DRINK NOW", priority: 1, color: "bg-red-950/80 text-red-300 border-red-700/60" };
        } else if (CURRENT_YEAR >= start && CURRENT_YEAR <= end) {
          return { label: `🟢 READY (${start}–${end})`, priority: 2, color: "bg-emerald-950/80 text-emerald-300 border-emerald-700/60" };
        } else {
          return { label: `🔵 CELLAR (${start}–${end})`, priority: 3, color: "bg-sky-950/80 text-sky-300 border-sky-700/60" };
        }
      };

      const cellarWines = wines.filter(w => !w.isWishlist);
      const wishlistWines = wines.filter(w => w.isWishlist);
      const totalBottles = cellarWines.reduce((acc, w) => acc + w.quantity, 0);
      const totalRetailValue = cellarWines.reduce((acc, w) => acc + (w.quantity * (w.priceAud || 0)), 0);
      const totalCostPrice = cellarWines.reduce((acc, w) => acc + (w.quantity * (w.costPriceAud || 0)), 0);

      // Expand bottle inventory array for tier-colored 166-fridge grid
      const fridgeBottleTiers = [];
      cellarWines.forEach(wine => {
        for (let i = 0; i < wine.quantity; i++) {
          if (fridgeBottleTiers.length < FRIDGE_CAPACITY) {
            fridgeBottleTiers.push(wine.tier);
          }
        }
      });

      // Drink window counters
      const drinkNowCount = cellarWines.filter(w => getDrinkStatus(w.drinkStart, w.drinkEnd).priority === 1).length;
      const readyCount = cellarWines.filter(w => getDrinkStatus(w.drinkStart, w.drinkEnd).priority === 2).length;
      const cellarHoldCount = cellarWines.filter(w => getDrinkStatus(w.drinkStart, w.drinkEnd).priority === 3).length;

      let filteredCellar = cellarWines.filter(w => {
        const matchesQuery = w.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                             w.producer.toLowerCase().includes(searchQuery.toLowerCase()) ||
                             w.region.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesVarietal = selectedVarietal === 'All' || w.varietal === selectedVarietal;
        const matchesTier = selectedTier === 'All' || w.tier === selectedTier;
        return matchesQuery && matchesVarietal && matchesTier;
      });

      if (sortByDrinkWindow) {
        filteredCellar.sort((a, b) => {
          const statusA = getDrinkStatus(a.drinkStart, a.drinkEnd);
          const statusB = getDrinkStatus(b.drinkStart, b.drinkEnd);
          if (statusA.priority !== statusB.priority) {
            return statusA.priority - statusB.priority;
          }
          return a.drinkEnd - b.drinkEnd;
        });
      }

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
          {/* HEADER BAR */}
          <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h1 className="text-2xl md:text-3xl font-bold text-amber-500 tracking-wide flex items-center gap-2">
                🍷 Kiran's Cellar Tracker
              </h1>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              {!isReadOnly && (
                <>
                  <button
                    onClick={() => setShowAddModal(true)}
                    className="bg-emerald-600 hover:bg-emerald-500 text-stone-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow"
                  >
                    + Add New Wine
                  </button>
                  <button
                    onClick={() => setShowWishlistModal(true)}
                    className="bg-sky-600 hover:bg-sky-500 text-stone-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow"
                  >
                    + Add to Wishlist
                  </button>
                  <button
                    onClick={() => setShowCsvModal(true)}
                    className="bg-purple-600 hover:bg-purple-500 text-stone-100 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow flex items-center gap-1"
                  >
                    📥 Import CSV
                  </button>
                  <button
                    onClick={handleRefreshData}
                    className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow flex items-center gap-1"
                  >
                    🔄 Refresh Ratings
                    {refreshSuccess && <span className="bg-stone-900 text-amber-400 text-[10px] px-1 py-0.5 rounded">Done!</span>}
                  </button>
                </>
              )}

              {isReadOnly ? (

          {showCsvModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-xl w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-purple-400">📥 7-Column CSV Bulk Import</h3>
                  <button onClick={() => setShowCsvModal(false)} className="text-stone-400 hover:text-stone-200 font-bold">✕</button>
                </div>

                <div className="bg-stone-900/80 p-3 rounded-lg border border-stone-700/80 space-y-2 text-xs text-stone-300">
                  <p>Provide 7 basic fields: <code className="text-amber-400 font-bold">producer, name, vintage, varietal, quantity, tier, costPriceAud</code>. Regions, Halliday/Vivino ratings, drink windows, and market values are automatically populated!</p>
                  <button
                    type="button"
                    onClick={downloadCsvTemplate}
                    className="bg-amber-600/80 hover:bg-amber-500 text-stone-950 font-bold px-3 py-1 rounded text-[11px] transition inline-block"
                  >
                    📄 Download 7-Column Template
                  </button>
                </div>

                {/* File Upload Drop Area */}
                <div className="border-2 border-dashed border-stone-600 hover:border-purple-500 rounded-xl p-6 text-center bg-stone-900/50 transition">
                  <input
                    type="file"
                    accept=".csv"
                    onChange={handleCsvFileUpload}
                    className="hidden"
                    id="csvFileInput"
                  />
                  <label htmlFor="csvFileInput" className="cursor-pointer space-y-1 block">
                    <div className="text-2xl">📁</div>
                    <span className="text-xs font-bold text-purple-300 block">Click to select CSV File</span>
                    <span className="text-[10px] text-stone-400 block">{csvFileName || "No file selected"}</span>
                  </label>
                </div>

                {csvError && (
                  <div className="p-2 bg-red-950/80 border border-red-700 text-red-300 rounded text-xs">
                    ⚠️ {csvError}
                  </div>
                )}

                {/* Parsed Preview Table */}
                {csvParsedWines.length > 0 && (
                  <div className="space-y-2">
                    <span className="text-xs font-bold text-emerald-400 block">
                      ✔ Preview: {csvParsedWines.length} Wine(s) Ready to Import
                    </span>
                    <div className="max-h-40 overflow-y-auto bg-stone-950 p-2 rounded border border-stone-800 text-[11px]">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b border-stone-800 text-stone-400">
                            <th className="p-1">Vintage</th>
                            <th className="p-1">Producer</th>
                            <th className="p-1">Name</th>
                            <th className="p-1">Tier</th>
                            <th className="p-1">Cost</th>
                            <th className="p-1">Auto Market</th>
                          </tr>
                        </thead>
                        <tbody>
                          {csvParsedWines.map((row, idx) => (
                            <tr key={idx} className="border-b border-stone-900 text-stone-300">
                              <td className="p-1 text-amber-500">{row.vintage}</td>
                              <td className="p-1 font-bold">{row.producer}</td>
                              <td className="p-1">{row.name}</td>
                              <td className="p-1">{row.tier}</td>
                              <td className="p-1 text-rose-400">${row.costPriceAud}</td>
                              <td className="p-1 text-emerald-400">${row.priceAud}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowCsvModal(false)} className="px-3 py-1.5 bg-stone-700 text-stone-300 text-xs rounded">Cancel</button>
                  <button
                    type="button"
                    disabled={csvParsedWines.length === 0}
                    onClick={handleConfirmCsvImport}
                    className="px-4 py-1.5 bg-purple-600 hover:bg-purple-500 disabled:bg-stone-700 disabled:text-stone-500 text-stone-100 font-bold text-xs rounded"
                  >
                    Import {csvParsedWines.length} Bottles
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TASTING NOTE MODAL */}
          {selectedWineForTasting && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-md w-full space-y-3 shadow-2xl">
                <h3 className="text-sm font-bold text-amber-400">Log Tasting Note</h3>
                <p className="text-xs text-stone-300">{selectedWineForTasting.producer} - {selectedWineForTasting.name}</p>
                <textarea
                  rows="3"
                  placeholder="Record sensory profile..."
                  value={tastingNoteInput}
                  onChange={(e) => setTastingNoteInput(e.target.value)}
                  className="w-full bg-stone-900 border border-stone-700 rounded p-2 text-xs text-stone-100 focus:outline-none focus:border-amber-500"
                ></textarea>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setSelectedWineForTasting(null)} className="px-3 py-1.5 bg-stone-700 text-stone-300 text-xs rounded">Cancel</button>
                  <button onClick={addTastingNote} className="px-3 py-1.5 bg-amber-600 text-stone-950 font-bold text-xs rounded">Save Note</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<WineApp />, document.getElementById('root'));
  </script>
</body>
</html>

    // ---------------------------------------------------------------------
    // ERROR BOUNDARY — if anything crashes, your stored data is untouched
    // ---------------------------------------------------------------------
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      render() {
        if (this.state.error) {
          return (
            <div className="max-w-xl mx-auto p-6 space-y-3">
              <h1 className="text-xl font-bold text-amber-500">Something went wrong</h1>
              <p className="text-sm text-stone-300">Your saved cellar data has not been changed. Download a raw copy first, then reload.</p>
              <div className="flex gap-2">
                <button onClick={() => downloadFile(`cellar-raw-${localDate()}.json`, storage.get(STORAGE_KEY) || '[]', 'application/json')}
                  className="bg-emerald-600 text-stone-950 font-bold px-3 py-1.5 rounded text-xs">Download raw data</button>
                <button onClick={() => window.location.reload()} className="bg-stone-700 px-3 py-1.5 rounded text-xs">Reload</button>
              </div>
              <pre className="text-[10px] text-stone-500 whitespace-pre-wrap">{String(this.state.error)}</pre>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ---------------------------------------------------------------------
    // MAIN APP
    // ---------------------------------------------------------------------
    function WineApp() {
      const [boot] = useState(loadInitial);
      const [wines, setWines] = useState(boot.wines);
      const [isReadOnly, setIsReadOnly] = useState(boot.readOnly);
      const [saveBlocked, setSaveBlocked] = useState(boot.saveBlocked);
      const [notice, setNotice] = useState(boot.message);
      const [saveError, setSaveError] = useState(false);
      const [snapshots, setSnapshots] = useState(readSnapshots);
      const [meta, setMeta] = useState(() => readJson(META_KEY, {}) || {});
      const [persistState, setPersistState] = useState('checking');
      const [reminderDismissed, setReminderDismissed] = useState(false);
      const [toast, setToast] = useState(null);

      const [activeTab, setActiveTab] = useState('cellar');
      const [shareSuccess, setShareSuccess] = useState(false);
      const [shareFallbackUrl, setShareFallbackUrl] = useState('');
      const [refreshSuccess, setRefreshSuccess] = useState(false);

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedVarietal, setSelectedVarietal] = useState('All');
      const [selectedTier, setSelectedTier] = useState('All');
      const [sortByDrinkWindow, setSortByDrinkWindow] = useState(false);

      const [selectedWineForTasting, setSelectedWineForTasting] = useState(null);
      const [tastingNoteInput, setTastingNoteInput] = useState('');
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingWine, setEditingWine] = useState(null);
      const [showWishlistModal, setShowWishlistModal] = useState(false);
      const [showCsvModal, setShowCsvModal] = useState(false);
      const [showBackupModal, setShowBackupModal] = useState(false);

      const [csvPreview, setCsvPreview] = useState([]);
      const [csvFileName, setCsvFileName] = useState('');
      const [csvError, setCsvError] = useState('');

      const [restorePreview, setRestorePreview] = useState(null);
      const [restoreError, setRestoreError] = useState('');

      const [wishlistForm, setWishlistForm] = useState({ vintage: String(CURRENT_YEAR - 2), producer: '', varietal: '', name: '' });

      const lastSavedRef = useRef(boot.readOnly ? null : storage.get(STORAGE_KEY));
      const readOnlyRef = useRef(isReadOnly);
      readOnlyRef.current = isReadOnly;

      // --- Save to browser storage whenever wines change -----------------
      useEffect(() => {
        if (isReadOnly || saveBlocked) return;
        const json = JSON.stringify(wines);
        if (json === lastSavedRef.current) return;
        const ok = storage.set(STORAGE_KEY, json);
        if (ok) lastSavedRef.current = json;
        setSaveError(!ok);
      }, [wines, isReadOnly, saveBlocked]);

      // --- Restore point on first load each day (and after an upgrade) ---
      useEffect(() => {
        if (boot.readOnly || boot.saveBlocked) return;
        if (boot.migrated && boot.rawBefore && boot.rawBefore.length) {
          setSnapshots(addSnapshot(boot.rawBefore, 'Before upgrade to new format'));
        }
        const today = localDate();
        const hasToday = readSnapshots().some(s => /^Daily/.test(s.label) && localDate(new Date(s.at)) === today);
        if (!hasToday && boot.wines.length) setSnapshots(addSnapshot(boot.wines, 'Daily — start of day'));
      }, []);

      // --- Ask the browser not to evict our storage ----------------------
      useEffect(() => {
        const s = navigator.storage;
        if (!s || !s.persist || !s.persisted) { setPersistState('unsupported'); return; }
        s.persisted()
          .then(p => p ? true : s.persist())
          .then(granted => setPersistState(granted ? 'granted' : 'denied'))
          .catch(() => setPersistState('unsupported'));
      }, []);

      // --- Keep multiple open tabs in sync (prevents one tab overwriting another)
      useEffect(() => {
        const onStorage = (e) => {
          if (e.key !== STORAGE_KEY || e.newValue == null || readOnlyRef.current) return;
          try {
            const parsed = JSON.parse(e.newValue);
            if (!Array.isArray(parsed)) return;
            const normalized = normalizeList(parsed);
            lastSavedRef.current = JSON.stringify(normalized);
            setWines(normalized);
          } catch (err) { /* ignore unreadable external writes */ }
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      // --- Toast auto-dismiss --------------------------------------------
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), toast.undo ? 8000 : 3500);
        return () => clearTimeout(t);
      }, [toast]);

      const saveMeta = (patch) => {
        const next = { ...meta, ...patch };
        setMeta(next);
        storage.set(META_KEY, JSON.stringify(next));
      };

      const takeSnapshot = (label, list = wines) => setSnapshots(addSnapshot(list, label));

      // --- Basic actions -------------------------------------------------
      const updateQuantity = (id, delta) => {
        if (isReadOnly) return;
        setWines(prev => prev.map(w => w.id === id ? { ...w, quantity: Math.max(0, w.quantity + delta) } : w));
      };

      const deleteWine = (id) => {
        if (isReadOnly) return;
        const index = wines.findIndex(w => w.id === id);
        if (index === -1) return;
        const removed = wines[index];
        setWines(prev => prev.filter(w => w.id !== id));
        setToast({
          text: `Deleted ${removed.producer} ${removed.name}`,
          undo: () => setWines(prev => {
            if (prev.some(w => w.id === removed.id)) return prev;
            const next = [...prev];
            next.splice(Math.min(index, next.length), 0, removed);
            return next;
          })
        });
      };

      const moveToCellar = (id) => {
        if (isReadOnly) return;
        setWines(prev => prev.map(w => w.id === id ? { ...w, isWishlist: false, quantity: Math.max(1, w.quantity) } : w));
      };

      const handleSaveNewWine = (form) => {
        const created = formToWine(form);
        setWines(prev => [created, ...prev]);
        setShowAddModal(false);
      };

      const handleSaveEdit = (form) => {
        const updated = formToWine(form, editingWine);
        setWines(prev => prev.map(w => w.id === updated.id ? updated : w));
        setEditingWine(null);
      };

      const handleAddWishlist = (e) => {
        e.preventDefault();
        const [ds, de] = estimateWindow(wishlistForm.producer, wishlistForm.name, wishlistForm.varietal, wishlistForm.vintage);
        const match = findBenchmark(wishlistForm.producer, wishlistForm.name);
        const created = sanitize({
          id: newId(),
          producer: wishlistForm.producer,
          name: wishlistForm.name || wishlistForm.varietal,
          vintage: wishlistForm.vintage,
          varietal: wishlistForm.varietal,
          region: match ? match.region : '',
          quantity: 0,
          tier: match ? match.tier : 'Yellow',
          hallidayScore: match ? match.hallidayScore : null,
          vivinoRating: match ? match.vivinoRating : null,
          ratingsVerified: false,
          drinkStart: ds, drinkEnd: de, windowEstimated: true,
          isWishlist: true,
          styleNote: match ? match.styleNote : ''
        });
        setWines(prev => [created, ...prev]);
        setShowWishlistModal(false);
        setWishlistForm({ vintage: String(CURRENT_YEAR - 2), producer: '', varietal: '', name: '' });
      };

      const handleShareLink = async () => {
        const cellarOnly = wines.filter(w => !w.isWishlist);
        const shareUrl = `${window.location.origin}${window.location.pathname}#data=${encodeURIComponent(encodeShare(cellarOnly))}`;
        try {
          await navigator.clipboard.writeText(shareUrl);
          setShareSuccess(true);
          setTimeout(() => setShareSuccess(false), 3000);
        } catch (e) {
          setShareFallbackUrl(shareUrl);
        }
      };

      // Refresh only touches ESTIMATES — never your own scores, prices, windows or notes.
      const handleRefreshEstimates = () => {
        if (isReadOnly) return;
        setWines(prev => prev.map(wine => {
          const match = findBenchmark(wine.producer, wine.name);
          const next = { ...wine };
          if (match) {
            if (!wine.ratingsVerified) { next.hallidayScore = match.hallidayScore; next.vivinoRating = match.vivinoRating; }
            if (!wine.region) next.region = match.region;
            next.styleNote = match.styleNote;
          }
          if (wine.windowEstimated || wine.drinkStart == null || wine.drinkEnd == null) {
            const [a, b] = estimateWindow(wine.producer, wine.name, wine.varietal, wine.vintage);
            next.drinkStart = a; next.drinkEnd = b; next.windowEstimated = true;
          }
          return sanitize(next); // recalculates estimated prices; manual prices are kept
        }));
        setRefreshSuccess(true);
        setTimeout(() => setRefreshSuccess(false), 3000);
      };

      const addTastingNote = () => {
        if (!selectedWineForTasting || !tastingNoteInput.trim()) return;
        const dateStr = new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
        setWines(prev => prev.map(w => w.id === selectedWineForTasting.id
          ? { ...w, notes: w.notes ? `${w.notes} | [${dateStr}]: ${tastingNoteInput.trim()}` : `[${dateStr}]: ${tastingNoteInput.trim()}` }
          : w));
        setSelectedWineForTasting(null);
        setTastingNoteInput('');
      };

      // --- CSV import ----------------------------------------------------
      const parseCsvFile = (file) => {
        setCsvError('');
        setCsvPreview([]);
        setCsvFileName(file.name);
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const rows = parseCsv(e.target.result);
            if (rows.length < 2) { setCsvError('CSV file appears to be empty or missing headers.'); return; }
            const headers = rows[0].map(normHeader);
            const idx = {};
            Object.keys(HEADER_ALIASES).forEach(k => { idx[k] = headers.findIndex(h => HEADER_ALIASES[k].includes(h)); });
            if (idx.producer === -1 && idx.name === -1) {
              setCsvError('Could not find a "producer" or "name" column. Download the template to see the expected headers.');
              return;
            }
            const existingIds = new Set(wines.map(w => w.id));
            const existingKeys = new Set(wines.map(w => `${w.producer}|${w.name}|${w.vintage}`.toLowerCase()));
            const preview = [];
            for (let r = 1; r < rows.length; r++) {
              const row = rows[r];
              const get = (k) => { const i = idx[k]; return (i !== undefined && i !== -1 && row[i] !== undefined) ? String(row[i]).trim() : ''; };
              const wine = csvRowToWine(get);
              const isUpdate = existingIds.has(wine.id);
              const isLikelyDuplicate = !isUpdate && existingKeys.has(`${wine.producer}|${wine.name}|${wine.vintage}`.toLowerCase());
              preview.push({ wine, isUpdate, isLikelyDuplicate });
            }
            if (preview.length === 0) setCsvError('No valid rows could be extracted.');
            else setCsvPreview(preview);
          } catch (err) {
            console.error(err);
            setCsvError('Failed to parse CSV file. Check formatting.');
          }
        };
        reader.readAsText(file);
      };

      const handleConfirmCsvImport = () => {
        if (csvPreview.length === 0) return;
        takeSnapshot('Before CSV import');
        setWines(prev => mergeWines(prev, csvPreview.map(p => p.wine)));
        setToast({ text: `Imported ${csvPreview.length} row(s). A restore point was saved first.` });
        setShowCsvModal(false);
        setCsvPreview([]);
        setCsvFileName('');
      };

      const downloadCsvTemplate = () => {
        const csvContent = "producer,name,vintage,varietal,quantity,tier,costPriceAud\r\n" +
          "Penfolds,St Henri Shiraz,2022,Shiraz,2,Red,120\r\n" +
          "Grosset,Polish Hill Riesling,2025,Riesling,3,Blue,75\r\n" +
          "Tyrrell's,Vat 1 Semillon,2019,Semillon,2,Yellow,90\r\n" +
          "Golden Grove,Estate Chardonnay,2024,Chardonnay,2,Green,30";
        downloadFile("cellar_import_7col.csv", csvContent, 'text/csv;charset=utf-8;');
      };

      // --- Backup / export / restore ------------------------------------
      const handleDownloadBackup = () => {
        const payload = {
          app: "Kiran's Cellar Tracker",
          format: 'cellar-backup',
          schemaVersion: SCHEMA_VERSION,
          exportedAt: new Date().toISOString(),
          count: wines.length,
          bottles: sumBottles(wines.filter(w => !w.isWishlist)),
          wines
        };
        downloadFile(`cellar-backup-${localDate()}.json`, JSON.stringify(payload, null, 2), 'application/json');
        saveMeta({ lastBackupAt: new Date().toISOString() });
        setToast({ text: 'Backup downloaded. Keep it somewhere safe (iCloud Drive, OneDrive, email to yourself).' });
      };

      const handleExportCsv = () => {
        downloadFile(`cellar-export-${localDate()}.csv`, winesToCsv(wines), 'text/csv;charset=utf-8;');
        saveMeta({ lastBackupAt: new Date().toISOString() });
      };

      const handleDownloadRaw = () => {
        downloadFile(`cellar-raw-browser-data-${localDate()}.json`, storage.get(STORAGE_KEY) || '[]', 'application/json');
      };

      const handleRestoreFile = (file) => {
        setRestoreError('');
        setRestorePreview(null);
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = parseBackupJson(e.target.result);
            if (parsed.wines.length === 0) throw new Error('This backup contains no wines.');
            setRestorePreview({ ...parsed, fileName: file.name });
          } catch (err) {
            setRestoreError(`Could not read that backup: ${err.message}`);
          }
        };
        reader.readAsText(file);
      };

      const applyRestore = (mode) => {
        if (!restorePreview) return;
        takeSnapshot(mode === 'replace' ? 'Before restore (replace)' : 'Before restore (merge)');
        setWines(prev => mode === 'replace' ? restorePreview.wines : mergeWines(prev, restorePreview.wines));
        setSaveBlocked(false);
        setNotice(null);
        setToast({ text: `Restored ${restorePreview.wines.length} entries (${mode}). A restore point of the previous state was saved.` });
        setRestorePreview(null);
      };

      const restoreSnapshot = (snap) => {
        takeSnapshot('Before restoring a restore point');
        setWines(normalizeList(snap.wines));
        setSaveBlocked(false);
        setNotice(null);
        setToast({ text: `Restored the ${fmtDateTime(snap.at)} restore point.` });
      };

      // --- Shared (read-only) link → your own cellar ----------------------
      const leaveSharedView = (newWines) => {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
        lastSavedRef.current = storage.get(STORAGE_KEY);
        setWines(newWines);
        setIsReadOnly(false);
        setSnapshots(readSnapshots());
      };

      const readMyCellar = () => {
        const raw = storage.get(STORAGE_KEY);
        if (raw == null) return [];
        try { const p = JSON.parse(raw); return Array.isArray(p) ? normalizeList(p) : null; } catch (e) { return null; }
      };

      const importShared = (mode) => {
        const mine = readMyCellar();
        if (mine === null) { setNotice({ type: 'error', text: 'Your own saved cellar could not be read, so nothing was changed. Open Backup & Restore first.' }); return; }
        if (mine.length) setSnapshots(addSnapshot(mine, mode === 'replace' ? 'Before replacing with shared link' : 'Before adding shared link'));
        leaveSharedView(mode === 'replace' ? wines : mergeWines(mine, wines));
        setToast({ text: mode === 'replace' ? 'Your cellar was replaced with the shared wines. A restore point was saved.' : 'Shared wines were added to your cellar.' });
      };

      const openMyCellar = () => {
        const mine = readMyCellar();
        leaveSharedView(mine || []);
      };

      // --- Derived values --------------------------------------------------
      const cellarWines = wines.filter(w => !w.isWishlist);
      const wishlistWines = wines.filter(w => w.isWishlist);
      const totalBottles = sumBottles(cellarWines);
      const totalRetailValue = cellarWines.reduce((acc, w) => acc + (w.quantity * (w.priceAud || 0)), 0);
      const totalCostPrice = cellarWines.reduce((acc, w) => acc + (w.quantity * (w.costPriceAud || 0)), 0);
      const roiPct = totalCostPrice > 0 ? Math.round(((totalRetailValue - totalCostPrice) / totalCostPrice) * 100) : null;
      const anyEstimatedPrice = cellarWines.some(w => w.quantity > 0 && !w.priceManual);

      const fridgeBottleTiers = [];
      cellarWines.forEach(wine => {
        for (let i = 0; i < wine.quantity; i++) {
          if (fridgeBottleTiers.length < FRIDGE_CAPACITY) fridgeBottleTiers.push(wine.tier);
        }
      });

      const bottlesWithPriority = (p) => sumBottles(cellarWines.filter(w => getDrinkStatus(w).priority === p));
      const drinkNowCount = bottlesWithPriority(1);
      const readyCount = bottlesWithPriority(2);
      const cellarHoldCount = bottlesWithPriority(3);

      const varietalOptions = useMemo(() =>
        Array.from(new Set(cellarWines.map(w => w.varietal).filter(Boolean))).sort((a, b) => a.localeCompare(b)),
        [wines]);

      useEffect(() => {
        if (selectedVarietal !== 'All' && !varietalOptions.includes(selectedVarietal)) setSelectedVarietal('All');
      }, [varietalOptions]);

      const q = searchQuery.trim().toLowerCase();
      let filteredCellar = cellarWines.filter(w => {
        const matchesQuery = !q || [w.name, w.producer, w.region, w.varietal, w.vintage].some(x => String(x || '').toLowerCase().includes(q));
        const matchesVarietal = selectedVarietal === 'All' || w.varietal === selectedVarietal;
        const matchesTier = selectedTier === 'All' || w.tier === selectedTier;
        return matchesQuery && matchesVarietal && matchesTier;
      });

      if (sortByDrinkWindow) {
        filteredCellar = [...filteredCellar].sort((a, b) => {
          const pa = getDrinkStatus(a).priority, pb = getDrinkStatus(b).priority;
          if (pa !== pb) return pa - pb;
          return (a.drinkEnd ?? 9999) - (b.drinkEnd ?? 9999);
        });
      }

      const backupAgeDays = daysSince(meta.lastBackupAt);
      const showBackupReminder = !isReadOnly && !reminderDismissed && wines.length > 0 && backupAgeDays > BACKUP_REMINDER_DAYS;

      // --- Render ---------------------------------------------------------
      return (
        <div className="max-w-7xl mx-auto p-4 md:p-6 space-y-6 pb-24">
          {/* HEADER BAR */}
          <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <h1 className="text-2xl md:text-3xl font-bold text-amber-500 tracking-wide flex items-center gap-2">🍷 Kiran's Cellar Tracker</h1>

            <div className="flex flex-wrap items-center gap-2">
              {!isReadOnly && (
                <>
                  <button onClick={() => setShowAddModal(true)} className="bg-emerald-600 hover:bg-emerald-500 text-stone-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow">+ Add New Wine</button>
                  <button onClick={() => setShowWishlistModal(true)} className="bg-sky-600 hover:bg-sky-500 text-stone-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow">+ Add to Wishlist</button>
                  <button onClick={() => setShowCsvModal(true)} className="bg-purple-600 hover:bg-purple-500 text-stone-100 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow">📥 Import CSV</button>
                  <button onClick={handleRefreshEstimates} className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow flex items-center gap-1"
                    title="Updates estimated scores, drink windows and estimated values. Never changes anything you entered yourself.">
                    🔄 Refresh Estimates
                    {refreshSuccess && <span className="bg-stone-900 text-amber-400 text-[10px] px-1 py-0.5 rounded">Done!</span>}
                  </button>
                  <button onClick={() => setShowBackupModal(true)} className="bg-stone-100 hover:bg-white text-stone-900 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow">💾 Backup & Restore</button>
                </>
              )}
              {isReadOnly ? (
                <div className="bg-amber-900/40 border border-amber-600/50 px-3 py-1.5 rounded-lg text-amber-200 text-xs font-medium">🔒 Shared view (read-only)</div>
              ) : (
                <button onClick={handleShareLink} className="bg-stone-700 hover:bg-stone-600 text-stone-200 font-semibold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1 shadow">
                  <span>🔗 Share</span>
                  {shareSuccess && <span className="text-[10px] bg-stone-900 text-amber-400 px-1 py-0.5 rounded">Copied!</span>}
                </button>
              )}
            </div>
          </div>

          {/* BANNERS */}
          {isReadOnly && (
            <div className="bg-amber-950/60 border border-amber-700/60 rounded-xl p-4 text-xs text-amber-100 space-y-2">
              <p><strong>You're viewing a shared cellar ({cellarWines.length} wines, {totalBottles} bottles).</strong> Nothing here is saved until you choose below.</p>
              <div className="flex flex-wrap gap-2">
                <button onClick={() => importShared('merge')} className="bg-emerald-600 hover:bg-emerald-500 text-stone-950 font-bold px-3 py-1.5 rounded">Add these to my cellar</button>
                <ConfirmButton onConfirm={() => importShared('replace')} className="bg-rose-700 hover:bg-rose-600 text-stone-100 font-bold px-3 py-1.5 rounded" confirmLabel="Tap again — replaces your cellar">
                  Replace my cellar with these
                </ConfirmButton>
                <button onClick={openMyCellar} className="bg-stone-700 hover:bg-stone-600 text-stone-200 font-semibold px-3 py-1.5 rounded">Open my own cellar</button>
              </div>
            </div>
          )}

          {notice && (
            <div className={`rounded-xl p-3 text-xs flex justify-between gap-3 border ${notice.type === 'error' ? 'bg-red-950/70 border-red-700 text-red-200' : 'bg-sky-950/60 border-sky-700/60 text-sky-100'}`}>
              <span>{notice.type === 'error' ? '⚠️ ' : 'ℹ️ '}{notice.text}</span>
              <button onClick={() => setNotice(null)} className="font-bold opacity-70 hover:opacity-100">✕</button>
            </div>
          )}

          {saveError && (
            <div className="rounded-xl p-3 text-xs bg-red-950/70 border border-red-700 text-red-200 flex flex-wrap items-center justify-between gap-2">
              <span>⚠️ This browser refused to save your latest changes (private browsing or storage full). Download a backup now so nothing is lost.</span>
              <button onClick={handleDownloadBackup} className="bg-red-200 text-red-950 font-bold px-3 py-1 rounded">Download backup</button>
            </div>
          )}

          {saveBlocked && (
            <div className="rounded-xl p-3 text-xs bg-red-950/70 border border-red-700 text-red-200">
              <p>⚠️ Saving is paused to protect your unreadable saved data. Restoring a backup or restore point resumes saving.</p>
              <div className="flex flex-wrap gap-2 mt-2">
                <button onClick={handleDownloadRaw} className="bg-red-200 text-red-950 font-bold px-3 py-1 rounded">Download raw data</button>
                <button onClick={() => setShowBackupModal(true)} className="bg-stone-700 text-stone-100 font-semibold px-3 py-1 rounded">Open Backup & Restore</button>
                <ConfirmButton onConfirm={() => { setSaveBlocked(false); setNotice(null); }} className="bg-stone-800 border border-red-700 text-red-200 px-3 py-1 rounded" confirmLabel="Tap again — overwrite saved data">
                  Start fresh anyway
                </ConfirmButton>
              </div>
            </div>
          )}

          {showBackupReminder && (
            <div className="rounded-xl p-3 text-xs bg-amber-950/50 border border-amber-700/60 text-amber-100 flex flex-wrap items-center justify-between gap-2">
              <span>💾 {meta.lastBackupAt ? `Your last backup was ${backupAgeDays} days ago.` : "You haven't downloaded a backup yet."} Your cellar only lives in this browser — a backup file protects it if the browser data is cleared.</span>
              <div className="flex gap-2">
                <button onClick={handleDownloadBackup} className="bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold px-3 py-1 rounded">Download backup</button>
                <button onClick={() => setReminderDismissed(true)} className="text-amber-300 hover:text-amber-100 px-2">Later</button>
              </div>
            </div>
          )}

          {/* STAT SUMMARY BAR */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="bg-stone-800/80 border border-stone-700/60 p-3.5 rounded-xl text-center flex flex-col justify-between space-y-2">
              <span className="text-[10px] text-stone-400 uppercase tracking-wider block font-semibold">Fridge Capacity</span>
              <div className="flex justify-center items-baseline gap-1.5">
                <span className={`text-lg font-bold ${totalBottles > FRIDGE_CAPACITY ? 'text-red-400' : 'text-amber-400'}`}>{totalBottles} / {FRIDGE_CAPACITY}</span>
                <span className="text-xs font-semibold text-amber-500">({((totalBottles / FRIDGE_CAPACITY) * 100).toFixed(1)}%)</span>
              </div>
              <div className="bg-stone-950 p-2 rounded-lg border border-stone-800/80">
                <div className="grid grid-cols-12 md:grid-cols-[repeat(17,minmax(0,1fr))] gap-1 justify-items-center">
                  {Array.from({ length: FRIDGE_CAPACITY }).map((_, idx) => {
                    const bottleTier = fridgeBottleTiers[idx];
                    const tierDotColor = bottleTier ? TIER_COLORS[bottleTier] : 'bg-stone-900 border border-stone-800';
                    return <div key={idx} title={bottleTier ? `Slot ${idx + 1}: ${bottleTier} Tier` : `Slot ${idx + 1}: Empty`} className={`w-1.5 h-1.5 rounded-full transition-all ${tierDotColor}`} />;
                  })}
                </div>
              </div>
              {totalBottles > FRIDGE_CAPACITY && <span className="text-[10px] text-red-400">{totalBottles - FRIDGE_CAPACITY} bottles over capacity</span>}
            </div>

            <div className="bg-stone-800/80 border border-stone-700/60 p-4 rounded-xl text-center flex flex-col justify-center space-y-1">
              <span className="text-[10px] text-stone-400 uppercase tracking-wider block font-semibold">Cellar Portfolio Value</span>
              <div>
                <span className="text-2xl font-bold text-emerald-400">{anyEstimatedPrice ? '≈' : ''}{fmtMoney(totalRetailValue)}</span>
                <span className="text-[10px] text-stone-400 block font-medium" title="Wines without a market price you entered are valued at cost × tier multiplier (Green 1.10, Yellow 1.15, Blue 1.20, Red 1.25; +0.05 for Halliday 96+).">
                  {anyEstimatedPrice ? 'Estimated value (cost × tier multiplier)' : 'Market value (your prices)'}
                </span>
              </div>
              <div className="pt-1 border-t border-stone-700/50 flex justify-center items-center gap-2">
                <div>
                  <span className="text-xs font-bold text-rose-400">{fmtMoney(totalCostPrice)}</span>
                  <span className="text-[9px] text-rose-300/80 block">Cost Price</span>
                </div>
                {roiPct !== null && (
                  <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded border ${roiPct >= 0 ? 'text-emerald-400 bg-emerald-950/80 border-emerald-700/60' : 'text-rose-400 bg-rose-950/80 border-rose-700/60'}`}>
                    {roiPct >= 0 ? '+' : ''}{roiPct}%{anyEstimatedPrice ? ' est.' : ''}
                  </span>
                )}
              </div>
            </div>

            <div className="bg-stone-800/80 border border-stone-700/60 p-4 rounded-xl text-center flex flex-col justify-center space-y-1">
              <span className="text-[10px] text-stone-400 uppercase tracking-wider block font-semibold">Drinking Window (bottles)</span>
              <div className="grid grid-cols-3 gap-1 pt-1 text-center">
                <div className="bg-red-950/60 border border-red-800/60 rounded p-1">
                  <span className="text-sm font-bold text-red-300 block">{drinkNowCount}</span>
                  <span className="text-[9px] text-red-400 block font-medium">Drink Now</span>
                </div>
                <div className="bg-emerald-950/60 border border-emerald-800/60 rounded p-1">
                  <span className="text-sm font-bold text-emerald-300 block">{readyCount}</span>
                  <span className="text-[9px] text-emerald-400 block font-medium">Ready</span>
                </div>
                <div className="bg-sky-950/60 border border-sky-800/60 rounded p-1">
                  <span className="text-sm font-bold text-sky-300 block">{cellarHoldCount}</span>
                  <span className="text-[9px] text-sky-400 block font-medium">Cellar/Hold</span>
                </div>
              </div>
            </div>

            <div className="bg-stone-800/80 border border-stone-700/60 p-4 rounded-xl text-center flex flex-col justify-center">
              <span className="text-[10px] text-stone-400 uppercase tracking-wider block font-semibold">Wishlist Items</span>
              <span className="text-2xl font-bold text-sky-400">{wishlistWines.length}</span>
              <span className="text-[10px] text-stone-500 block mt-0.5">Saved Recommendations</span>
            </div>
          </div>

          <p className="text-[10px] text-stone-500 -mt-3">
            Solid badges = figures you entered. Dashed badges = estimates (reference list or cost × tier). Tap ✏️ on a bottle to enter real scores or prices.
          </p>

          {/* NAVIGATION TABS */}
          <div className="flex border-b border-stone-700 gap-2">
            {[['cellar', `🍾 Current Cellar (${cellarWines.length})`], ['wishlist', `📌 Wishlist / Recommendations (${wishlistWines.length})`]].map(([key, label]) => (
              <button key={key} onClick={() => setActiveTab(key)}
                className={`px-5 py-3 font-semibold text-sm rounded-t-lg transition ${activeTab === key ? 'bg-amber-600 text-stone-950 border-b-2 border-amber-400' : 'bg-stone-800/50 text-stone-400 hover:text-stone-200'}`}>
                {label}
              </button>
            ))}
          </div>

          {/* CELLAR GRID */}
          {activeTab === 'cellar' && (
            <div className="space-y-4">
              <div className="flex flex-col md:flex-row gap-3 bg-stone-800/60 p-3 rounded-xl border border-stone-700/50 items-center justify-between">
                <div className="flex flex-col md:flex-row gap-2 w-full md:w-auto flex-1">
                  <input type="text" placeholder="Search producer, region, varietal, vintage..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                    className="bg-stone-900 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-stone-100 focus:outline-none focus:border-amber-500 md:w-72" />
                  <select value={selectedVarietal} onChange={(e) => setSelectedVarietal(e.target.value)}
                    className="bg-stone-900 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-stone-100 focus:outline-none focus:border-amber-500">
                    <option value="All">All Varietals</option>
                    {varietalOptions.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                  <select value={selectedTier} onChange={(e) => setSelectedTier(e.target.value)}
                    className="bg-stone-900 border border-stone-700 rounded-lg px-3 py-1.5 text-xs text-stone-100 focus:outline-none focus:border-amber-500">
                    <option value="All">All Tiers</option>
                    {TIERS.map(t => <option key={t} value={t}>{t} Tier</option>)}
                  </select>
                </div>
                <button onClick={() => setSortByDrinkWindow(!sortByDrinkWindow)}
                  className={`w-full md:w-auto px-3 py-1.5 rounded-lg text-xs font-bold transition border flex items-center justify-center gap-1.5 ${sortByDrinkWindow ? 'bg-amber-500 text-stone-950 border-amber-300 ring-2 ring-amber-400/50' : 'bg-stone-700/80 hover:bg-stone-600 text-stone-200 border-stone-600'}`}>
                  <span>⏳ Best to Drink</span>
                  {sortByDrinkWindow && <span className="bg-stone-900 text-amber-300 text-[10px] px-1 rounded">Active</span>}
                </button>
              </div>

              {cellarWines.length === 0 && (
                <div className="text-center text-sm text-stone-400 py-12 border border-dashed border-stone-700 rounded-xl">
                  No bottles yet. Use <strong>+ Add New Wine</strong>, <strong>📥 Import CSV</strong>, or restore a backup from <strong>💾 Backup & Restore</strong>.
                </div>
              )}

              {/* 4-COLUMN CARD GRID */}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                {filteredCellar.map((wine) => {
                  const drinkStatus = getDrinkStatus(wine);
                  return (
                    <div key={wine.id} className={`bg-stone-800/90 border border-stone-700/80 rounded-lg p-3 shadow flex flex-col justify-between space-y-2 hover:border-amber-500/50 transition ${wine.quantity === 0 ? 'opacity-60' : ''}`}>
                      <div>
                        <div className="flex justify-between items-center pb-1.5 border-b border-stone-700/50">
                          <span className="text-[11px] font-bold text-amber-500 uppercase tracking-wider">{wine.vintage || 'NV'}</span>
                          <div className="flex items-center gap-1.5">
                            <span className={`w-2.5 h-2.5 rounded-full ${TIER_COLORS[wine.tier]}`} title={`${wine.tier} Tier`} />
                            <HallidayBadge wine={wine} />
                            <VivinoBadge wine={wine} />
                            <PriceBadge wine={wine} />
                            {!isReadOnly && (
                              <button onClick={() => deleteWine(wine.id)} className="text-stone-400 hover:text-red-400 hover:bg-stone-700/80 p-1 rounded transition text-xs ml-0.5" title="Delete (can be undone)">🗑️</button>
                            )}
                          </div>
                        </div>

                        <div className="flex justify-between items-baseline mt-1.5">
                          <h3 className="text-sm font-bold text-stone-100 truncate max-w-[65%]">{wine.producer}</h3>
                          <span className="text-[10px] font-medium text-stone-400 truncate max-w-[35%] text-right">{wine.region}</span>
                        </div>
                        <p className="text-xs text-stone-300 font-medium truncate">{wine.name}{wine.varietal && wine.varietal !== wine.name ? <span className="text-stone-500"> · {wine.varietal}</span> : null}</p>

                        <div className="mt-2">
                          <span className={`inline-block border px-1.5 py-0.5 rounded text-[10px] font-bold ${drinkStatus.color}`}>{drinkStatus.label}</span>
                        </div>

                        {wine.notes ? (
                          <p className="text-[10px] text-amber-200/90 italic mt-1.5 line-clamp-2 bg-stone-900/60 p-1.5 rounded border border-amber-900/30" title={wine.notes}>"{wine.notes}"</p>
                        ) : wine.styleNote ? (
                          <p className="text-[10px] text-stone-400 italic mt-1.5 line-clamp-2 bg-stone-900/40 p-1.5 rounded border border-stone-700/40" title={`Reference style note (not an official review): ${wine.styleNote}`}>
                            <span className="not-italic text-stone-500">Style: </span>{wine.styleNote}
                          </p>
                        ) : null}
                      </div>

                      <div className="flex justify-between items-center pt-1.5 border-t border-stone-700/50 text-xs">
                        {!isReadOnly ? (
                          <div className="flex items-center gap-1">
                            <button onClick={() => updateQuantity(wine.id, -1)} className="w-5 h-5 bg-stone-700 hover:bg-stone-600 rounded font-bold text-stone-200 text-xs flex items-center justify-center">-</button>
                            <span className="font-bold text-stone-100 text-xs px-1">{wine.quantity}</span>
                            <button onClick={() => updateQuantity(wine.id, 1)} className="w-5 h-5 bg-stone-700 hover:bg-stone-600 rounded font-bold text-stone-200 text-xs flex items-center justify-center">+</button>
                          </div>
                        ) : (
                          <span className="text-[10px] text-stone-400">Qty: {wine.quantity}</span>
                        )}
                        {!isReadOnly && (
                          <div className="flex items-center gap-2">
                            <button onClick={() => setEditingWine(wine)} className="text-[10px] text-stone-300 hover:text-amber-400 underline">✏️ Edit</button>
                            <button onClick={() => setSelectedWineForTasting(wine)} className="text-[10px] text-stone-300 hover:text-amber-400 underline">+ Tasting</button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* WISHLIST TAB */}
          {activeTab === 'wishlist' && (
            <div className="space-y-4">
              {wishlistWines.length === 0 && (
                <div className="text-center text-sm text-stone-400 py-12 border border-dashed border-stone-700 rounded-xl">Your wishlist is empty.</div>
              )}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                {wishlistWines.map((wine) => (
                  <div key={wine.id} className="bg-stone-800/90 border border-stone-700/80 rounded-lg p-3 shadow flex flex-col justify-between space-y-2">
                    <div>
                      <div className="flex justify-between items-center pb-1.5 border-b border-stone-700/50">
                        <span className="text-[11px] font-bold text-sky-400 uppercase tracking-wider">{wine.vintage || 'NV'}</span>
                        <div className="flex items-center gap-1.5">
                          <span className={`w-2.5 h-2.5 rounded-full ${TIER_COLORS[wine.tier]}`} />
                          {!isReadOnly && (
                            <>
                              <button onClick={() => setEditingWine(wine)} className="text-stone-400 hover:text-amber-400 text-xs p-1" title="Edit">✏️</button>
                              <button onClick={() => deleteWine(wine.id)} className="text-stone-400 hover:text-red-400 text-xs p-1" title="Delete (can be undone)">🗑️</button>
                            </>
                          )}
                        </div>
                      </div>
                      <div className="flex justify-between items-baseline mt-1.5">
                        <h3 className="text-sm font-bold text-stone-100 truncate">{wine.producer}</h3>
                        <span className="text-[10px] font-medium text-stone-400 truncate">{wine.varietal}</span>
                      </div>
                      <p className="text-xs text-stone-300 font-medium truncate">{wine.name}</p>
                      {wine.notes && <p className="text-[10px] text-amber-200/80 italic mt-1 line-clamp-2">"{wine.notes}"</p>}
                    </div>
                    {!isReadOnly && (
                      <button onClick={() => moveToCellar(wine.id)} className="w-full bg-emerald-600 hover:bg-emerald-500 text-stone-950 font-bold py-1.5 rounded text-xs transition">+ Move to Cellar</button>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* FOOTER STATUS */}
          {!isReadOnly && (
            <div className="text-[10px] text-stone-500 border-t border-stone-800 pt-3 flex flex-wrap gap-x-4 gap-y-1">
              <span>Saved in this browser only.</span>
              <span>Last backup: {meta.lastBackupAt ? fmtDateTime(meta.lastBackupAt) : 'never'}</span>
              <span>Restore points: {snapshots.length}</span>
              <span>Storage protection: {persistState === 'granted' ? 'on' : persistState === 'checking' ? '…' : 'not granted by browser'}</span>
            </div>
          )}

          {/* ADD / EDIT MODALS */}
          {showAddModal && (
            <WineFormModal title="Add Wine to Cellar" initialForm={EMPTY_FORM} showDbSearch onSave={handleSaveNewWine} onClose={() => setShowAddModal(false)} />
          )}
          {editingWine && (
            <WineFormModal title={`Edit — ${editingWine.producer} ${editingWine.name}`} initialForm={wineToForm(editingWine)} saveLabel="Save Changes"
              onSave={handleSaveEdit} onClose={() => setEditingWine(null)} />
          )}

          {/* WISHLIST MODAL */}
          {showWishlistModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-sm w-full space-y-3 shadow-2xl">
                <h3 className="text-base font-bold text-sky-400">+ Add to Wishlist</h3>
                <form onSubmit={handleAddWishlist} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-stone-400 mb-1">Year / Vintage</label>
                    <input type="text" value={wishlistForm.vintage} onChange={e => setWishlistForm({ ...wishlistForm, vintage: e.target.value })} className={inputCls} />
                  </div>
                  <div>
                    <label className="block text-stone-400 mb-1">Producer</label>
                    <input required type="text" placeholder="e.g. Yarra Yering" value={wishlistForm.producer} onChange={e => setWishlistForm({ ...wishlistForm, producer: e.target.value })} className={inputCls} />
                  </div>
                  <div>
                    <label className="block text-stone-400 mb-1">Wine Name (optional)</label>
                    <input type="text" placeholder="e.g. Dry Red No. 1" value={wishlistForm.name} onChange={e => setWishlistForm({ ...wishlistForm, name: e.target.value })} className={inputCls} />
                  </div>
                  <div>
                    <label className="block text-stone-400 mb-1">Varietal</label>
                    <input required type="text" placeholder="e.g. Pinot Noir" value={wishlistForm.varietal} onChange={e => setWishlistForm({ ...wishlistForm, varietal: e.target.value })} className={inputCls} />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowWishlistModal(false)} className="px-3 py-1.5 bg-stone-700 text-stone-300 rounded">Cancel</button>
                    <button type="submit" className="px-3 py-1.5 bg-sky-600 text-stone-950 font-bold rounded">Add Wishlist</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CSV IMPORT MODAL */}
          {showCsvModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-xl w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-purple-400">📥 CSV Bulk Import</h3>
                  <button onClick={() => { setShowCsvModal(false); setCsvPreview([]); setCsvFileName(''); setCsvError(''); }} className="text-stone-400 hover:text-stone-200 font-bold">✕</button>
                </div>

                <div className="bg-stone-900/80 p-3 rounded-lg border border-stone-700/80 space-y-2 text-xs text-stone-300">
                  <p>Minimum 7 columns: <code className="text-amber-400 font-bold">producer, name, vintage, varietal, quantity, tier, costPriceAud</code>.</p>
                  <p className="text-stone-400">Optional: <code>region, hallidayScore, vivinoRating, marketPriceAud, drinkStart, drinkEnd, notes</code>. Scores you include are treated as your own; anything missing is estimated and shown with dashed badges. A CSV exported from Backup & Restore can be re-imported — matching rows update instead of duplicating.</p>
                  <button type="button" onClick={downloadCsvTemplate} className="bg-amber-600/80 hover:bg-amber-500 text-stone-950 font-bold px-3 py-1 rounded text-[11px] transition inline-block">📄 Download Template</button>
                </div>

                <div className="border-2 border-dashed border-stone-600 hover:border-purple-500 rounded-xl p-6 text-center bg-stone-900/50 transition">
                  <input type="file" accept=".csv,text/csv" onChange={(e) => { const f = e.target.files[0]; if (f) parseCsvFile(f); e.target.value = ''; }} className="hidden" id="csvFileInput" />
                  <label htmlFor="csvFileInput" className="cursor-pointer space-y-1 block">
                    <div className="text-2xl">📁</div>
                    <span className="text-xs font-bold text-purple-300 block">Click to select CSV File</span>
                    <span className="text-[10px] text-stone-400 block">{csvFileName || "No file selected"}</span>
                  </label>
                </div>

                {csvError && <div className="p-2 bg-red-950/80 border border-red-700 text-red-300 rounded text-xs">⚠️ {csvError}</div>}

                {csvPreview.length > 0 && (
                  <div className="space-y-2">
                    <span className="text-xs font-bold text-emerald-400 block">
                      ✔ {csvPreview.filter(p => !p.isUpdate).length} new, {csvPreview.filter(p => p.isUpdate).length} update(s) — {sumBottles(csvPreview.map(p => p.wine))} bottles
                    </span>
                    {csvPreview.some(p => p.isLikelyDuplicate) && (
                      <span className="text-[11px] text-amber-300 block">⚠️ {csvPreview.filter(p => p.isLikelyDuplicate).length} row(s) look like wines already in your cellar (same producer, name and vintage) and will be added as separate entries.</span>
                    )}
                    <div className="max-h-48 overflow-y-auto bg-stone-950 p-2 rounded border border-stone-800 text-[11px]">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b border-stone-800 text-stone-400">
                            <th className="p-1"></th><th className="p-1">Vintage</th><th className="p-1">Producer</th><th className="p-1">Name</th>
                            <th className="p-1">Qty</th><th className="p-1">Tier</th><th className="p-1">Cost</th><th className="p-1">Value</th>
                          </tr>
                        </thead>
                        <tbody>
                          {csvPreview.map(({ wine: row, isUpdate, isLikelyDuplicate }, idx) => (
                            <tr key={idx} className="border-b border-stone-900 text-stone-300">
                              <td className="p-1 text-[9px]">{isUpdate ? <span className="text-sky-400">UPD</span> : isLikelyDuplicate ? <span className="text-amber-400">DUP?</span> : <span className="text-emerald-400">NEW</span>}</td>
                              <td className="p-1 text-amber-500">{row.vintage}</td>
                              <td className="p-1 font-bold">{row.producer}</td>
                              <td className="p-1">{row.name}</td>
                              <td className="p-1">{row.quantity}</td>
                              <td className="p-1">{row.tier}</td>
                              <td className="p-1 text-rose-400">{fmtMoney(row.costPriceAud)}</td>
                              <td className="p-1 text-emerald-400">{row.priceManual ? '' : '≈'}{fmtMoney(row.priceAud)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => { setShowCsvModal(false); setCsvPreview([]); setCsvFileName(''); setCsvError(''); }} className="px-3 py-1.5 bg-stone-700 text-stone-300 text-xs rounded">Cancel</button>
                  <button type="button" disabled={csvPreview.length === 0} onClick={handleConfirmCsvImport}
                    className="px-4 py-1.5 bg-purple-600 hover:bg-purple-500 disabled:bg-stone-700 disabled:text-stone-500 text-stone-100 font-bold text-xs rounded">
                    Import {csvPreview.length} Row(s)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BACKUP & RESTORE MODAL */}
          {showBackupModal && (
            <div className="fixed inset-0 bg-black/80 flex items-start md:items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-xl w-full space-y-4 shadow-2xl my-8">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-stone-100">💾 Backup & Restore</h3>
                  <button onClick={() => { setShowBackupModal(false); setRestorePreview(null); setRestoreError(''); }} className="text-stone-400 hover:text-stone-200 font-bold">✕</button>
                </div>

                <section className="bg-stone-900/80 p-3 rounded-lg border border-stone-700 space-y-2 text-xs">
                  <h4 className="font-bold text-emerald-400">1. Save a copy</h4>
                  <p className="text-stone-400">Your cellar is stored only in this browser. Download a backup regularly and keep it in iCloud Drive, OneDrive or email. Last backup: <span className="text-stone-200">{meta.lastBackupAt ? fmtDateTime(meta.lastBackupAt) : 'never'}</span>.</p>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={handleDownloadBackup} className="bg-emerald-600 hover:bg-emerald-500 text-stone-950 font-bold px-3 py-1.5 rounded">⬇️ Download full backup (.json)</button>
                    <button onClick={handleExportCsv} className="bg-stone-700 hover:bg-stone-600 text-stone-100 font-semibold px-3 py-1.5 rounded">⬇️ Export spreadsheet (.csv)</button>
                  </div>
                  <p className="text-[10px] text-stone-500">The .json backup is the complete, exact copy (cellar + wishlist + notes). The .csv opens in Excel and can also be re-imported.</p>
                </section>

                <section className="bg-stone-900/80 p-3 rounded-lg border border-stone-700 space-y-2 text-xs">
                  <h4 className="font-bold text-sky-400">2. Restore from a backup file</h4>
                  <input type="file" accept=".json,application/json" id="restoreFileInput" className="hidden"
                    onChange={(e) => { const f = e.target.files[0]; if (f) handleRestoreFile(f); e.target.value = ''; }} />
                  <label htmlFor="restoreFileInput" className="inline-block cursor-pointer bg-sky-700 hover:bg-sky-600 text-stone-100 font-semibold px-3 py-1.5 rounded">📂 Choose backup file (.json)</label>
                  {restoreError && <div className="p-2 bg-red-950/80 border border-red-700 text-red-300 rounded">⚠️ {restoreError}</div>}
                  {restorePreview && (
                    <div className="p-2 bg-stone-950 border border-stone-700 rounded space-y-2">
                      <p className="text-stone-200">
                        <strong>{restorePreview.fileName}</strong>: {restorePreview.wines.length} entries, {sumBottles(restorePreview.wines.filter(w => !w.isWishlist))} bottles
                        {restorePreview.exportedAt ? `, saved ${fmtDateTime(restorePreview.exportedAt)}` : ''}.
                      </p>
                      <div className="flex flex-wrap gap-2">
                        <ConfirmButton onConfirm={() => applyRestore('replace')} className="bg-rose-700 hover:bg-rose-600 text-stone-100 font-bold px-3 py-1.5 rounded" confirmLabel="Tap again to replace">
                          Replace current cellar
                        </ConfirmButton>
                        <button onClick={() => applyRestore('merge')} className="bg-stone-700 hover:bg-stone-600 text-stone-100 font-semibold px-3 py-1.5 rounded">Merge into current cellar</button>
                      </div>
                      <p className="text-[10px] text-stone-500">A restore point of your current cellar is saved automatically before either option.</p>
                    </div>
                  )}
                </section>

                <section className="bg-stone-900/80 p-3 rounded-lg border border-stone-700 space-y-2 text-xs">
                  <h4 className="font-bold text-amber-400">3. Automatic restore points</h4>
                  <p className="text-stone-400">Saved in this browser at the start of each day and before every import or restore (last {MAX_SNAPSHOTS} kept). They protect against mistakes, not against the browser data being cleared — that's what the backup file is for.</p>
                  {snapshots.length === 0 ? (
                    <p className="text-stone-500 italic">None yet.</p>
                  ) : (
                    <div className="max-h-48 overflow-y-auto space-y-1">
                      {[...snapshots].reverse().map(s => (
                        <div key={s.id} className="flex flex-wrap items-center justify-between gap-2 bg-stone-950 border border-stone-800 rounded p-1.5">
                          <div>
                            <span className="text-stone-200 font-semibold">{fmtDateTime(s.at)}</span>
                            <span className="text-stone-500 block text-[10px]">{s.label} · {s.count} entries · {s.bottles} bottles</span>
                          </div>
                          <div className="flex gap-1">
                            <button onClick={() => downloadFile(`cellar-restore-point-${localDate(new Date(s.at))}.json`, JSON.stringify({ app: "Kiran's Cellar Tracker", format: 'cellar-backup', schemaVersion: SCHEMA_VERSION, exportedAt: s.at, wines: s.wines }, null, 2), 'application/json')}
                              className="bg-stone-700 hover:bg-stone-600 px-2 py-1 rounded text-[10px]">Download</button>
                            <ConfirmButton onConfirm={() => restoreSnapshot(s)} className="bg-sky-800 hover:bg-sky-700 px-2 py-1 rounded text-[10px]" confirmLabel="Confirm restore">Restore</ConfirmButton>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

                <section className="text-[10px] text-stone-500 space-y-1">
                  <p>Storage protection: {persistState === 'granted' ? '✅ this browser has agreed not to clear the cellar automatically.' : persistState === 'checking' ? 'checking…' : '⚠️ not granted. Safari in particular can delete site data if you don\'t open the site for about 7 days — keep backups current.'}</p>
                  <p>Always open the tracker from the same GitHub Pages address — a different address or a local copy of the file has its own, separate storage.</p>
                  <button onClick={handleDownloadRaw} className="underline hover:text-stone-300">Download raw browser data (for troubleshooting)</button>
                </section>
              </div>
            </div>
          )}

          {/* SHARE LINK FALLBACK */}
          {shareFallbackUrl && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-md w-full space-y-3 shadow-2xl">
                <h3 className="text-sm font-bold text-amber-400">Copy your share link</h3>
                <p className="text-xs text-stone-400">Your browser blocked automatic copying. Select and copy the link below. It opens a read-only view of your cellar (wishlist not included).</p>
                <textarea readOnly rows="4" value={shareFallbackUrl} onFocus={e => e.target.select()} className={`${inputCls} text-[10px]`} />
                <div className="flex justify-end">
                  <button onClick={() => setShareFallbackUrl('')} className="px-3 py-1.5 bg-stone-700 text-stone-300 text-xs rounded">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* TASTING NOTE MODAL */}
          {selectedWineForTasting && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-stone-800 border border-stone-700 rounded-xl p-5 max-w-md w-full space-y-3 shadow-2xl">
                <h3 className="text-sm font-bold text-amber-400">Log Tasting Note</h3>
                <p className="text-xs text-stone-300">{selectedWineForTasting.producer} - {selectedWineForTasting.name}</p>
                <textarea rows="3" placeholder="Record sensory profile..." value={tastingNoteInput} onChange={(e) => setTastingNoteInput(e.target.value)}
                  className="w-full bg-stone-900 border border-stone-700 rounded p-2 text-xs text-stone-100 focus:outline-none focus:border-amber-500" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => { setSelectedWineForTasting(null); setTastingNoteInput(''); }} className="px-3 py-1.5 bg-stone-700 text-stone-300 text-xs rounded">Cancel</button>
                  <button onClick={addTastingNote} className="px-3 py-1.5 bg-amber-600 text-stone-950 font-bold text-xs rounded">Save Note</button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST */}
          {toast && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] bg-stone-100 text-stone-900 text-xs font-medium px-4 py-2.5 rounded-lg shadow-2xl flex items-center gap-3 max-w-[92vw]">
              <span>{toast.text}</span>
              {toast.undo && (
                <button onClick={() => { toast.undo(); setToast(null); }} className="font-bold text-amber-700 hover:text-amber-600 underline">Undo</button>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary><WineApp /></ErrorBoundary>
    );
  </script>
</body>
</html>
